<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D шутер с HP и ИИ</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Arial', sans-serif;
  background: #111;
  user-select: none;
}
#ui {
  position: absolute; top: 20px; left: 20px; z-index: 10;
  display: flex; flex-direction: column; gap: 10px;
}
#ui button {
  padding: 12px 20px; font-size: 14px; border: none; border-radius: 8px;
  background: #4CAF50; color: #fff; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  transition: background 0.2s, transform 0.1s;
}
#ui button:hover {
  background: #45a049;
  transform: scale(1.05);
}
#stats {
  position: absolute; top: 20px; right: 20px; z-index: 10;
  color: #fff; font-size: 16px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;
}
</style>
</head>
<body>
<div id="ui">
  <button id="shootBtn">🔫 Стрелять</button>
  <button id="reloadBtn">♻️ Перезарядка</button>
  <button id="themeBtn">🌙 Тема</button>
</div>
<div id="stats">
  HP: <span id="playerHP">100</span> | Очки: <span id="score">0</span>
</div>

<script>
let scene, camera, renderer, clock;
let bullets = [], enemies = [], particles = [];
let score = 0;

const player = {
  position: new THREE.Vector3(0, 1.6, 5),
  speed: 0.2,
  hp: 100,
  maxHp: 100,
  ammo: 20,
  maxAmmo: 20,
  reloadTime: 2,
  isReloading: false,
  velocity: new THREE.Vector3()
};

let isDarkMode = false;
const keys = {};
let moveCameraMode = false;

// Инициализация сцены и объектов
init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x202020);

  // Освещение
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Пол
  const groundGeo = new THREE.PlaneGeometry(100, 100);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Враги
  for(let i=0; i<20; i++) spawnEnemy();

  // Камера
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 300);
  camera.position.copy(player.position);
  camera.lookAt(player.position.x, player.position.y, player.position.z-1);

  // Визуальный прицел
  const crossGeo = new THREE.RingGeometry(0.02, 0.04, 32);
  const crossMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
  const cross = new THREE.Mesh(crossGeo, crossMat);
  cross.position.z = -0.2;
  camera.add(cross);
  scene.add(camera);

  // renderer
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Мышь для прицела
  document.addEventListener('mousemove', (e) => {
    if(!moveCameraMode) {
      const deltaX = e.movementX || 0;
      const deltaY = e.movementY || 0;
      camera.rotation.y -= deltaX * 0.002;
      camera.rotation.x -= deltaY * 0.002;
      camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
    }
  });

  // Кнопки
  document.getElementById('shootBtn').onclick = () => shoot();
  document.getElementById('reloadBtn').onclick = () => reload();
  document.getElementById('themeBtn').onclick = () => toggleTheme();

  // Клавиши
  document.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if(e.key === 'ArrowUp') keys['arrowup'] = true;
    if(e.key === 'ArrowDown') keys['arrowdown'] = true;
    if(e.key === 'ArrowLeft') keys['arrowleft'] = true;
    if(e.key === 'ArrowRight') keys['arrowright'] = true;
    if(e.key === 'Shift') moveCameraMode = true;
  });
  document.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
    if(e.key === 'ArrowUp') keys['arrowup'] = false;
    if(e.key === 'ArrowDown') keys['arrowdown'] = false;
    if(e.key === 'ArrowLeft') keys['arrowleft'] = false;
    if(e.key === 'ArrowRight') keys['arrowright'] = false;
    if(e.key === 'Shift') moveCameraMode = false;
  });

  // Объект прицела (уже добавлен)

  clock = new THREE.Clock();
}

function spawnEnemy() {
  const size = Math.random() * 0.8 + 0.3;
  const geo = new THREE.CylinderGeometry(size*0.3, size*0.3, size*1.2, 12);
  const mat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
  const enemy = new THREE.Mesh(geo, mat);
  enemy.position.x = (Math.random() - 0.5) * 80;
  enemy.position.z = (Math.random() - 0.5) * 80;
  enemy.position.y = size * 0.6;
  enemy.castShadow = true;
  enemy.userData = { health: 50, size: size*0.3, attackCooldown: 0, velocity: new THREE.Vector3() };
  scene.add(enemy);
  enemies.push(enemy);
}

function shoot() {
  if(player.ammo <=0 || player.isReloading || player.hp<=0) return;
  const geometry = new THREE.SphereGeometry(0.12, 8, 8);
  const material = new THREE.MeshStandardMaterial({ color: 0xffff00 });
  const bullet = new THREE.Mesh(geometry, material);
  bullet.position.copy(camera.position);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  bullet.userData = { velocity: dir.multiplyScalar(2), lifeTime: 0 };
  bullet.castShadow = true;
  scene.add(bullet);
  bullets.push(bullet);
  player.ammo--;
}

function reload() {
  if(player.isReloading || player.ammo===player.maxAmmo) return;
  player.isReloading = true;
  setTimeout(()=>{ player.ammo=player.maxAmmo; player.isReloading=false; }, player.reloadTime*1000);
}

function toggleTheme() {
  document.body.classList.toggle('dark');
  scene.background.setHex(document.body.classList.contains('dark') ? 0x111 : 0x202020);
}

// Обработка движения игрока
function handlePlayerMovement(delta) {
  // Перемещение игрока
  if(!moveCameraMode && player.hp > 0) {
    if(keys['w']) player.position.z -= player.speed;
    if(keys['s']) player.position.z += player.speed;
    if(keys['a']) player.position.x -= player.speed;
    if(keys['d']) player.position.x += player.speed;
  }
}

// Обновление камеры
function updateCamera() {
  if(moveCameraMode) {
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 2;
    camera.position.y = player.position.y + 1;
    camera.lookAt(player.position.x, player.position.y, player.position.z);
  } else {
    // Камера смотрит в сторону
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 2;
    camera.position.y = player.position.y + 1;
    camera.lookAt(player.position.x, player.position.y, player.position.z);
  }
}

// Основная анимация
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  handlePlayerMovement(delta);
  updateCamera();

  // Убийство игрока при нуле HP
  if(player.hp <= 0) {
    alert("Вы проиграли! Перезагрузите страницу");
    return;
  }

  // Враги уклоняются
  enemies.forEach(e => {
    const toPlayer = new THREE.Vector3().subVectors(player.position, e.position);
    const avoidDir = new THREE.Vector3().crossVectors(toPlayer, new THREE.Vector3(0,1,0)).normalize();
    avoidDir.multiplyScalar(0.02);
    e.userData.velocity.add(avoidDir);
    e.userData.velocity.clampLength(0, 0.03);
    e.position.add(e.userData.velocity);
    e.userData.velocity.multiplyScalar(0.95);

    // Враги стреляют
    if(e.userData.attackCooldown <=0 && e.position.distanceTo(player.position) < 20) {
      enemyShoot(e);
      e.userData.attackCooldown = Math.random()*3+2;
    } else {
      e.userData.attackCooldown -= delta;
    }
  });

  // Обновляем пули
  for(let i=bullets.length-1; i>=0; i--) {
    const b = bullets[i];
    b.position.add(b.userData.velocity);
    b.userData.lifeTime += delta;
    if(b.position.length() > 300 || b.userData.lifeTime > 3) {
      scene.remove(b);
      bullets.splice(i,1);
    } else {
      // Столкновение с врагами
      for(let j=enemies.length-1; j>=0; j--) {
        const e=enemies[j];
        if(b.position.distanceTo(e.position) < e.userData.size + 0.12) {
          e.userData.health -= 25;
          scene.remove(b);
          bullets.splice(i,1);
          if(e.userData.health<=0) {
            scene.remove(e);
            enemies.splice(j,1);
            createExplosion(e.position);
            score +=10;
            spawnEnemy();
          }
          break;
        }
      }
    }
  }

  // Взаимодействие с врагами (наносить урон игроку)
  enemies.forEach(e => {
    if(e.position.distanceTo(player.position) < e.userData.size + 0.3) {
      // Враг наносит урон
      player.hp -= 0.2; // или больше, по желанию
      document.getElementById('playerHP').textContent = Math.max(0, Math.round(player.hp));
    }
  });

  // Враги стреляют по игроку
  enemies.forEach(e => {
    if(e.userData.attackCooldown <=0 && e.position.distanceTo(player.position) < 20) {
      enemyShoot(e);
      e.userData.attackCooldown = Math.random()*3+2;
    } else {
      e.userData.attackCooldown -= delta;
    }
  });

  // Обновляем частицы (взрывы)
  for(let i=particles.length-1; i>=0; i--) {
    const p=particles[i];
    p.position.add(p.userData.velocity);
    p.userData.life += delta;
    if(p.userData.life > 1) {
      scene.remove(p);
      particles.splice(i,1);
    }
  }

  // Обновление UI
  document.getElementById('playerHP').textContent = Math.max(0, Math.round(player.hp));
  document.getElementById('score').textContent = score;

  renderer.render(scene, camera);
}

// Враг стреляет
function enemyShoot(enemy) {
  const geo = new THREE.SphereGeometry(0.1, 8, 8);
  const mat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
  const bullet = new THREE.Mesh(geo, mat);
  bullet.position.copy(enemy.position);
  const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
  bullet.userData = { velocity: dir.multiplyScalar(2), lifeTime: 0, fromEnemy:true };
  scene.add(bullet);
  bullets.push(bullet);
}

// Взрыв
function createExplosion(pos) {
  const count = 20;
  for(let i=0; i<count; i++) {
    const geo = new THREE.SphereGeometry(0.05,6,6);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.userData = { velocity: new THREE.Vector3(
      (Math.random()-0.5)*2,
      Math.random()*2,
      (Math.random()-0.5)*2
    ), life:0 };
    scene.add(p);
    particles.push(p);
  }
}

// Основной цикл
function main() {
  requestAnimationFrame(main);
  const delta = clock.getDelta();
  animate();
}
main();
</script>
</body>
</html>
