<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>калькулятор</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #e0f7fa; /* светло-голубой фон */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    margin: 0;
  }

  h1 {
    color: #039be5;
    margin-bottom: 30px;
    font-size: 2.5em;
  }

  .calculator-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #b3e5fc; /* светлый голубой */
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    max-width: 380px;
    width: 100%;
  }

  /* дисплей */
  .display {
    background-color: #81d4fa;
    padding: 20px;
    font-size: 2.2em;
    border-radius: 15px;
    width: 100%;
    text-align: right;
    color: #fff;
    overflow-wrap: break-word;
    min-height: 60px;
    margin-bottom: 25px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
  }

  /* кнопки */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    width: 100%;
  }

  button {
    padding: 20px 0;
    font-size: 1.4em;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background-color: #039be5;
    color: #fff;
    transition: all 0.2s;
  }

  button:hover {
    background-color: #0277bd;
    transform: scale(1.05);
  }

  /* отдельные стили для операторов и очистки */
  .operator {
    background-color: #0288d1;
  }

  .operator:hover {
    background-color: #026aa7;
  }

  .clear {
    background-color: #01579b;
  }

  .clear:hover {
    background-color: #003c60;
  }

  /* стили для расширенного функционала снизу */
  .extra-functions {
    margin-top: 30px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* переключатели режимов */
  .mode-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
  }

  .mode-btn {
    padding: 10px 15px;
    border: none;
    border-radius: 12px;
    background-color: #039be5;
    color: #fff;
    cursor: pointer;
    font-size: 1em;
    transition: background-color 0.2s;
  }

  .mode-btn:hover {
    background-color: #0277bd;
  }

  /* блоки функций */
  .function-block {
    display: none;
    width: 100%;
    margin-top: 15px;
  }

  /* активный блок */
  .function-block.active {
    display: block;
  }

  /* input и select стили */
  .func-input {
    width: calc(50% - 10px);
    padding: 12px;
    font-size: 1.2em;
    border: 2px solid #039be5;
    border-radius: 10px;
    margin-bottom: 10px;
  }

  .func-select {
    width: 100%;
    padding: 12px;
    font-size: 1.2em;
    border: 2px solid #039be5;
    border-radius: 10px;
    margin-bottom: 10px;
  }

  .convert-btn {
    padding: 12px 20px;
    font-size: 1.2em;
    border: none;
    border-radius: 12px;
    background-color: #039be5;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .convert-btn:hover {
    background-color: #0277bd;
  }

  /* результат */
  .result {
    margin-top: 12px;
    font-size: 1.4em;
    color: #03396c;
    text-align: center;
  }
</style>
</head>
<body>

<h1>калькулятор</h1>

<div class="calculator-container">
  <!-- дисплей -->
  <div class="display" id="display">0</div>
  
  <!-- кнопки -->
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="setOperation('/')">/</button>
    
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="operator" onclick="setOperation('*')">&times;</button>
    
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="operator" onclick="setOperation('-')">-</button>
    
    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button style="grid-column: span 2;" onclick="calculate()">=</button>
    <button class="operator" onclick="setOperation('+')">+</button>
  </div>

  <!-- расширенный функционал -->
  <div class="extra-functions">
    <div class="mode-buttons">
      <button class="mode-btn" onclick="showFunction('scientific')">Научный</button>
      <button class="mode-btn" onclick="showFunction('basic')">Базовый</button>
    </div>

    <!-- Научный режим -->
    <div id="scientific" class="function-block active">
      <h3>Научные функции</h3>
      <button onclick="scientificOperation('sin')">sin</button>
      <button onclick="scientificOperation('cos')">cos</button>
      <button onclick="scientificOperation('tan')">tan</button>
      <button onclick="scientificOperation('sqrt')">√</button>
    </div>

    <!-- Базовый режим -->
    <div id="basic" class="function-block">
      <h3>Дополнительные функции</h3>
      <button onclick="changeSign()">±</button>
      <button onclick="percent()">%</button>
    </div>
  </div>
</div>

<script>
  // Основной калькулятор
  let currentInput = '0';
  let previousInput = '';
  let operation = null;

  const display = document.getElementById('display');

  function updateDisplay() {
    display.innerText = currentInput;
  }

  function appendNumber(number) {
    if (currentInput === '0' && number !== '.') {
      currentInput = number;
    } else {
      currentInput += number;
    }
    updateDisplay();
  }

  function setOperation(op) {
    if (operation !== null) {
      calculate();
    }
    previousInput = currentInput;
    currentInput = '0';
    operation = op;
  }

  function calculate() {
    const prev = parseFloat(previousInput);
    const current = parseFloat(currentInput);
    if (isNaN(prev) || isNaN(current)) return;

    let result;
    switch (operation) {
      case '+':
        result = prev + current;
        break;
      case '-':
        result = prev - current;
        break;
      case '*':
        result = prev * current;
        break;
      case '/':
        result = current === 0 ? 'Ошибка' : prev / current;
        break;
      default:
        return;
    }
    currentInput = result.toString();
    operation = null;
    updateDisplay();
  }

  function clearDisplay() {
    currentInput = '0';
    previousInput = '';
    operation = null;
    updateDisplay();
  }

  function changeSign() {
    let num = parseFloat(currentInput);
    if (isNaN(num)) return;
    num = -num;
    currentInput = num.toString();
    updateDisplay();
  }

  function percent() {
    let num = parseFloat(currentInput);
    if (isNaN(num)) return;
    num = num / 100;
    currentInput = num.toString();
    updateDisplay();
  }

  // Научные функции
  function scientificOperation(op) {
    const num = parseFloat(currentInput);
    if (isNaN(num)) return;
    let result;
    switch (op) {
      case 'sin':
        result = Math.sin(num);
        break;
      case 'cos':
        result = Math.cos(num);
        break;
      case 'tan':
        result = Math.tan(num);
        break;
      case 'sqrt':
        result = Math.sqrt(num);
        break;
    }
    currentInput = result.toFixed(6);
    updateDisplay();
  }

  // Переключение режима
  function showFunction(mode) {
    const blocks = document.querySelectorAll('.function-block');
    blocks.forEach(b => b.classList.remove('active'));
    document.getElementById(mode).classList.add('active');
  }

  // Инициализация дисплея
  updateDisplay();
</script>
</body>
</html>
