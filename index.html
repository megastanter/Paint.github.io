<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Block Blast web</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Block Blast</h1>
  <div class="score">Очки: <span id="score">0</span></div>
  <div class="level">Уровень: <span id="level">1</span></div>
  <button id="restart">Перезапустить</button>
</header>
<main>
  <div id="game-container"></div>
  <div id="game-over" class="hidden">
    <h2>Игра окончена!</h2>
    <button id="restart-over">Играть заново</button>
  </div>
</main>
<audio id="pop-sound" src="pop.mp3"></audio>
<script src="script.js"></script>
</body>
</html>
