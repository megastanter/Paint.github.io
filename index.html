<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painter</title>
<!-- Стиль Windows 10 -->
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f3f3f3;
}
header {
  background-color: #0078D7;
  padding: 10px;
  display: flex;
  align-items: center;
  color: white;
}
header h1 {
  margin: 0;
  font-size: 24px;
}
#toolbar {
  display: flex;
  flex-wrap: wrap;
  background: #e1e1e1;
  padding: 5px;
}
button, select, input[type=color], input[type=range], input[type=file] {
  margin: 2px;
  padding: 5px 10px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 4px;
  cursor: pointer;
}
button:hover {
  background-color: #d0d0d0;
}
#canvas-container {
  position: relative;
  height: calc(100vh - 80px);
  background: #fff;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#layers-panel {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 180px;
  max-height: 80%;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #999;
  padding: 5px;
  box-shadow: 0 0 8px rgba(0,0,0,0.2);
  font-size: 13px;
}
.layer-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
</style>
</head>
<body>
<header><h1>Painter</h1></header>
<div id="toolbar">
  <!-- Инструменты -->
  <button id="pencil" title="Карандаш">Карандаш</button>
  <button id="brush" title="Кисть">Кисть</button>
  <button id="eraser" title="Ластик">Ластик</button>
  <button id="fill" title="Заливка">Залить</button>
  <button id="text" title="Текст">Текст</button>
  <!-- Цвет -->
  <button id="color" title="Цвет">Цвет</button>
  <input type="color" id="colorPicker" value="#000000"/>
  <!-- Размер -->
  <button id="size" title="Размер">Размер</button>
  <input type="range" min="1" max="50" value="5" id="sizeRange"/>
  <!-- Функции -->
  <button id="undo" title="Отмена">Отмена</button>
  <button id="redo" title="Повтор">Повтор</button>
  <button id="save" title="Сохранить">Сохранить</button>
  <button id="load" title="Загрузить">Загрузить</button>
  <input type="file" id="fileInput" style="display:none"/>
  <button id="layersBtn" title="Слои">Слои</button>
  <button id="clear" title="Очистить">Очистить</button>
</div>
<div id="canvas-container">
  <canvas id="canvas"></canvas>
  <div id="layers-panel" style="display:none"></div>
</div>

<script>
// Инициализация
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let layers = [];
let currentLayer = null;
let isDrawing = false;
let currentTool = 'pencil'; // выбранный инструмент
let currentColor = document.getElementById('colorPicker').value;
let brushSize = parseInt(document.getElementById('sizeRange').value);
let startX=0, startY=0;
let history = [], redoStack=[];

// Создаём слой
function createLayer(name='Layer') {
  const layer = document.createElement('canvas');
  layer.width = canvas.width;
  layer.height = canvas.height;
  layer.style.position='absolute';
  layer.style.top='0';
  layer.style.left='0';
  layer.dataset.name=name;
  document.getElementById('layers-panel').appendChild(layer);
  layers.push(layer);
  currentLayer=layer;
}
function initLayers() {
  layers.forEach(l => l.remove());
  layers = [];
  createLayer('Layer 1');
  updateLayers();
}
function updateLayers() {
  const panel = document.getElementById('layers-panel');
  panel.innerHTML='';
  layers.forEach((l,i) => {
    const div = document.createElement('div');
    div.className='layer-item';
    const checkbox = document.createElement('input');
    checkbox.type='checkbox';
    checkbox.checked=true;
    checkbox.onchange= ()=> {
      l.style.display=checkbox.checked?'block':'none';
      draw();
    };
    div.appendChild(checkbox);
    const span=document.createElement('span');
    span.innerText=l.dataset.name;
    div.appendChild(span);
    const btn=document.createElement('button');
    btn.innerText='X';
    btn.onclick= ()=> {
      l.remove();
      layers.splice(i,1);
      if (currentLayer===l) {
        currentLayer=layers[layers.length-1] || null;
      }
      updateLayers();
      draw();
    };
    div.appendChild(btn);
    panel.appendChild(div);
  });
}

// Основные функции
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  layers.forEach(l => {
    if (l.style.display!=='none') {
      ctx.drawImage(l,0,0);
    }
  });
}

// Обработчики инструментов
document.getElementById('pencil').onclick= ()=> { currentTool='pencil'; };
document.getElementById('brush').onclick= ()=> { currentTool='brush'; };
document.getElementById('eraser').onclick= ()=> { currentTool='eraser'; };
document.getElementById('line').onclick= ()=> { currentTool='line'; };
document.getElementById('rect').onclick= ()=> { currentTool='rect'; };
document.getElementById('ellipse').onclick= ()=> { currentTool='ellipse'; };
document.getElementById('fill').onclick= ()=> { currentTool='fill'; };
document.getElementById('text').onclick= ()=> { currentTool='text'; };

// Цвет
document.getElementById('color').onclick= ()=> { document.getElementById('colorPicker').click(); };
document.getElementById('colorPicker').onchange= ()=> {
  currentColor = document.getElementById('colorPicker').value;
};

// Размер
document.getElementById('size').onclick= ()=> { document.getElementById('sizeRange').click(); };
document.getElementById('sizeRange').oninput= ()=> {
  brushSize=parseInt(document.getElementById('sizeRange').value);
};

// История
function saveHistory() {
  draw();
  history.push(canvas.toDataURL());
  if (history.length>200) history.shift();
}
function undo() {
  if (history.length===0) return;
  redoStack.push(canvas.toDataURL());
  const data=history.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayer(currentLayer);
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}
function redo() {
  if (redoStack.length===0) return;
  history.push(canvas.toDataURL());
  const data=redoStack.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayer(currentLayer);
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}

// Работа с файлами
document.getElementById('save').onclick= ()=> {
  draw();
  const dataURL=canvas.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=dataURL;
  a.download='image.png';
  a.click();
};
document.getElementById('load').onclick= ()=> {
  document.getElementById('fileInput').click();
};
document.getElementById('fileInput').onchange= (e)=> {
  const file=e.target.files[0];
  const reader=new FileReader();
  reader.onload= ()=> {
    const img=new Image();
    img.onload= ()=> {
      clearLayers();
      getLayerCtx(currentLayer).drawImage(img,0,0);
      draw();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
};
function clearLayers() {
  layers.forEach(l=>getLayerCtx(l).clearRect(0,0,l.width,l.height));
}
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  layers.forEach(l=> {
    if (l.style.display!=='none') ctx.drawImage(l,0,0);
  });
}

// История отмены
document.getElementById('undo').onclick= ()=> { undo(); };
document.getElementById('redo').onclick= ()=> { redo(); };
function saveHistory() {
  draw();
  history.push(canvas.toDataURL());
  if (history.length>300) history.shift();
}
function undo() {
  if (history.length===0) return;
  redoStack.push(canvas.toDataURL());
  const data=history.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayer(currentLayer);
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}
function redo() {
  if (redoStack.length===0) return;
  history.push(canvas.toDataURL());
  const data=redoStack.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayer(currentLayer);
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}

// Очистить всё
document.getElementById('clear').onclick= ()=> {
  saveHistory();
  layers.forEach(l=>getLayerCtx(l).clearRect(0,0,l.width,l.height));
  draw();
}

// Обработка мыши и фигуры
canvas.addEventListener('mousedown', e => {
  saveHistory();
  isDrawing=true;
  startX=e.offsetX;
  startY=e.offsetY;
  if (currentTool==='fill') {
    floodFill(getLayerCtx(currentLayer), startX, startY, currentColor);
    draw();
  } else if (currentTool==='text') {
    const txt=prompt('Введите текст');
    if (txt) {
      const ctx=getLayerCtx(currentLayer);
      ctx.font=`${brushSize*4}px Segoe UI`;
      ctx.fillStyle=currentColor;
      ctx.fillText(txt, startX, startY);
      draw();
    }
  } else {
    const ctx=getLayerCtx(currentLayer);
    ctx.lineWidth=brushSize;
    ctx.strokeStyle=currentColor;
    ctx.fillStyle=currentColor;
    if (currentTool==='pencil'||currentTool==='brush'||currentTool==='eraser') {
      ctx.beginPath(); ctx.moveTo(startX,startY);
    }
  }
});
canvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const ctx=getLayerCtx(currentLayer);
  if (currentTool==='pencil'||currentTool==='brush'||currentTool==='eraser') {
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
    draw();
  } else {
    draw();
    drawPreviewShape(e);
  }
});
canvas.addEventListener('mouseup', e => {
  if (!isDrawing) return;
  isDrawing=false;
  if (['line','rect','ellipse'].includes(currentTool)) {
    drawPreviewShape(e,true);
  }
  draw();
});

function drawPreviewShape(e,final=false) {
  draw();
  const ctx=getLayerCtx(currentLayer);
  ctx.lineWidth=brushSize;
  ctx.strokeStyle=currentColor;
  ctx.fillStyle=currentColor;
  const x=startX,y=startY,ex=e.offsetX,ey=e.offsetY;
  switch(currentTool) {
    case 'line':
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
      break;
    case 'rect':
      ctx.strokeRect(x,y,ex - x, ey - y);
      break;
    case 'ellipse':
      ctx.beginPath();
      ctx.ellipse((x+ex)/2, (y+ey)/2, Math.abs(ex - x)/2, Math.abs(ey - y)/2, 0, 0, Math.PI*2);
      ctx.stroke();
      break;
  }
}

// Функции заливки
function floodFill(ctx, x, y, fillColor) {
  const imageData=ctx.getImageData(0,0,ctx.canvas.width, ctx.canvas.height);
  const data=imageData.data;
  const targetColor=getColorAtPixel(data,x,y,ctx.canvas.width);
  const fillRGBA=hexToRGBA(fillColor);
  if (colorsEqual(targetColor,fillRGBA)) return;
  const stack=[{x,y}];
  while(stack.length>0) {
    const {x,y}=stack.pop();
    const currentColor=getColorAtPixel(data,x,y,ctx.canvas.width);
    if (colorsEqual(currentColor,targetColor)) {
      setColorAtPixel(data,x,y,fillRGBA,ctx.canvas.width);
      if (x+1<ctx.canvas.width) stack.push({x:x+1,y});
      if (x-1>=0) stack.push({x:x-1,y});
      if (y+1<ctx.canvas.height) stack.push({x,y:y+1});
      if (y-1>=0) stack.push({x,y:y-1});
    }
  }
  ctx.putImageData(imageData,0,0);
}
function getColorAtPixel(data,x,y,width) {
  const offset=(y*width + x)*4;
  return [data[offset],data[offset+1],data[offset+2],data[offset+3]];
}
function setColorAtPixel(data,x,y,color,width) {
  const offset=(y*width + x)*4;
  data[offset]=color[0];
  data[offset+1]=color[1];
  data[offset+2]=color[2];
  data[offset+3]=color[3];
}
function colorsEqual(c1,c2) {
  return c1[0]===c2[0] && c1[1]===c2[1] && c1[2]===c2[2] && c1[3]===c2[3];
}
function hexToRGBA(hex) {
  const r=parseInt(hex.substr(1,2),16);
  const g=parseInt(hex.substr(3,2),16);
  const b=parseInt(hex.substr(5,2),16);
  return [r,g,b,255];
}

// Настройка канваса
function resizeCanvas() {
  canvas.width=canvas.clientWidth;
  canvas.height=canvas.clientHeight;
  initLayers();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Инициализация
initLayers();

</script>
</div>
</body>
</html>
