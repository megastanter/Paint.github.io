<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Создай свою рулетку</title>
<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
    color: #222;
  }
  h1 {
    margin-bottom: 20px;
    color: #fff;
  }
  #inputs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 600px;
  }
  #inputs input {
    flex: 1;
    padding: 10px;
    font-size: 1em;
    border-radius: 8px;
    border: none;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
  }
  #buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 12px 20px;
    font-size: 1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
    background-color: #4CAF50;
    color: #fff;
  }
  button:hover {
    background-color: #45a049;
  }
  #list {
    margin-top: 20px;
    width: 100%;
    max-width: 600px;
  }
  #list ul {
    list-style: none;
    padding: 0;
  }
  #list li {
    background: rgba(255,255,255,0.2);
    margin-bottom: 8px;
    padding: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #list button {
    background-color: #f44336;
  }
  #spinBtn {
    margin-top: 30px;
    padding: 15px 30px;
    font-size: 1.5em;
    border-radius: 10px;
    border: none;
    background-color: #2196F3;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
  }
  #spinBtn:hover {
    background-color: #0b7dda;
  }
  #result {
    margin-top: 30px;
    font-size: 2em;
    font-weight: bold;
    color: #fff;
  }
</style>
</head>
<body>

<h1>Создай свою рулетку</h1>

<div id="inputs">
  <input type="text" id="optionInput" placeholder="Добавить вариант" />
</div>
<div id="buttons">
  <button onclick="addOption()">Добавить</button>
  <button onclick="clearOptions()">Очистить список</button>
</div>

<div id="list">
  <h2 style="color:#fff;">Ваши варианты:</h2>
  <ul id="optionsList"></ul>
</div>

<button id="spinBtn" onclick="spin()">Крутить рулетку</button>

<div id="result"></div>

<script>
  const options = [];

  function addOption() {
    const input = document.getElementById('optionInput');
    const value = input.value.trim();
    if(value && !options.includes(value)){
      options.push(value);
      updateList();
      input.value='';
    } else {
      alert('Введите уникальный вариант');
    }
  }

  function updateList() {
    const ul = document.getElementById('optionsList');
    ul.innerHTML='';
    options.forEach((opt, index) => {
      const li = document.createElement('li');
      li.textContent = opt;
      const delBtn = document.createElement('button');
      delBtn.textContent='Удалить';
      delBtn.onclick=()=>{ removeOption(index); };
      li.appendChild(delBtn);
      ul.appendChild(li);
    });
  }

  function removeOption(index) {
    options.splice(index,1);
    updateList();
  }

  function clearOptions() {
    options.length=0;
    updateList();
    document.getElementById('result').textContent='';
  }

  function spin() {
    if(options.length===0){
      alert('Добавьте варианты перед кручением!');
      return;
    }
    const randIndex = Math.floor(Math.random()*options.length);
    const selected = options[randIndex];
    document.getElementById('result').textContent= `🎉 Выпало: ${selected} 🎉`;
  }
</script>

</body>
</html>
