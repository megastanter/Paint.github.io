<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Decision Roulette web</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Decision Roulette web</h1>
</header>
<main>
  <section id="input-section">
    <h2>Добавьте варианты</h2>
    <input type="text" id="option-input" placeholder="Введите вариант" />
    <button id="add-option">Добавить</button>
    <ul id="options-list"></ul>
  </section>
  
  <section id="roulette-section" style="display:none;">
    <canvas id="roulette-canvas" width="500" height="500"></canvas>
    <div style="margin-top:20px;">
      <button id="spin-btn">Крутить</button>
      <button id="reset-btn" style="display:none;">Сбросить</button>
    </div>
    <div id="result" style="font-size:24px; margin-top:20px;"></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
