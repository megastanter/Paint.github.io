<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Классические Игры в Современном Стиле</title>
<!-- Подключение шрифтов -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: #121212;
    color: #fff;
  }

  header {
    background: linear-gradient(90deg, #1e3c72, #2a5298);
    padding: 30px 20px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 2.8em;
    letter-spacing: 2px;
  }

  .intro {
    max-width: 900px;
    margin: 20px auto;
    text-align: center;
    font-size: 1.2em;
    padding: 0 20px;
  }

  /* Сетка игр */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px;
  }

  /* Карточка игры */
  .game-card {
    background-color: #222;
    border-radius: 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .game-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .game-image {
    width: 100%;
    height: 180px;
    object-fit: cover;
  }

  .game-content {
    padding: 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .game-title {
    font-size: 1.4em;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .game-description {
    font-size: 0.95em;
    margin-bottom: 15px;
    color: #ccc;
  }

  .play-btn {
    background-color: #1e90ff;
    color: #fff;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.2s;
    text-decoration: none;
  }

  .play-btn:hover {
    background-color: #0066cc;
  }

  /* Встроенная игра */
  #game-container {
    display: none;
    padding: 20px;
  }

  #game-title {
    text-align: center;
    font-size: 2em;
    margin-bottom: 15px;
  }

  #iframe-game {
    width: 100%;
    height: 700px;
    border: none;
    border-radius: 10px;
  }

  #back-btn {
    display: block;
    margin: 20px auto 0 auto;
    padding: 12px 25px;
    background-color: #ff4d4d;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 1em;
    transition: background-color 0.2s;
  }

  #back-btn:hover {
    background-color: #cc3a3a;
  }

  /* Адаптация */
  @media(max-width: 768px){
    header h1 {
      font-size: 2em;
    }
    #game-title {
      font-size: 1.5em;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Классические Игры в Современном Стиле</h1>
</header>

<div class="intro">
  Добро пожаловать! Здесь вы можете играть в самые популярные старинные игры, такие как Тетрис, Змейка, Волк ловит яйца, Космический шутер, Пинг-понг и многие другие — прямо в вашем браузере.
</div>

<section class="games-grid" id="games-grid">
  <!-- Игра карточки будут добавляться через JavaScript -->
</section>

<!-- Контейнер для встроенной игры -->
<div id="game-container">
  <button id="back-btn">Назад к играм</button>
  <div id="game-title"></div>
  <iframe id="iframe-game" src="" allowfullscreen></iframe>
</div>

<script>
  // Массив игр с данными
  const games = [
    {
      id: 'tetris',
      title: 'Тетрис',
      description: 'Классическая головоломка, в которой нужно укладывать падающие фигуры, чтобы заполнять линии.',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://tetris.com/'
    },
    {
      id: 'snake',
      title: 'Змейка',
      description: 'Управляйте змейкой, чтобы есть яблоки и расти, избегая стен и собственного хвоста.',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://snakegame.io/'
    },
    {
      id: 'doodle',
      title: 'Дудл Джамп',
      description: 'Прыгайте по платформам, собирайте монеты и избегайте препятствий.',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://www.crazygames.com/game/doodle-jump'
    },
    {
      id: 'wolf',
      title: 'Волк ловит яйца',
      description: 'Управляйте волком, чтобы ловить падающие яйца, избегая пропуска и ошибок.',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://www.crazygames.com/game/wolf-animator'
    },
    {
      id: 'space',
      title: 'Космический шутер',
      description: 'Управляйте космическим кораблем, стреляйте по врагам и избегайте астероидов.',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://spaceinvaders.online/'
    },
    {
      id: 'pingpong',
      title: 'Пинг-понг',
      description: 'Классическая настольная игра, управляемая ракетками. Победите соперника!',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://papergame.io/ping-pong'
    },
    {
      id: 'pacman',
      title: 'Пакман',
      description: 'Классический лабиринт, где нужно есть точки и избегать привидений.',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://www.freepacman.org/'
    },
    {
      id: 'arkanoid',
      title: 'Арканоид',
      description: 'Разбейте все кирпичи, управляя платформой и мячом.',
      image: 'https://images.unsplash.com/photo-1623439277793-0f0f8f8f8f8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
      link: 'https://www.crazygames.com/game/arkanoid'
    }
  ];

  const gridContainer = document.getElementById('games-grid');

  // Генерация карточек игр
  games.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';

    card.innerHTML = `
      <img src="${game.image}" alt="${game.title}" class="game-image"/>
      <div class="game-content">
        <div class="game-title">${game.title}</div>
        <div class="game-description">${game.description}</div>
        <button class="play-btn" data-id="${game.id}">Играть</button>
      </div>
    `;
    gridContainer.appendChild(card);
  });

  // Обработчик кнопок "Играть"
  document.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const gameId = btn.dataset.id;
      const game = games.find(g => g.id === gameId);
      if (game) {
        document.querySelector('.games-grid').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';

        // Задаем iframe источник в зависимости от игры
        switch (gameId) {
          case 'tetris':
            document.getElementById('iframe-game').src = game.link;
            break;
          case 'snake':
            document.getElementById('iframe-game').src = game.link;
            break;
          case 'doodle':
            document.getElementById('iframe-game').src = game.link;
            break;
          case 'wolf':
            document.getElementById('iframe-game').src = game.link;
            break;
          case 'space':
            document.getElementById('iframe-game').src = game.link;
            break;
          case 'pingpong':
            document.getElementById('iframe-game').src = game.link;
            break;
          case 'pacman':
            document.getElementById('iframe-game').src = game.link;
            break;
          case 'arkanoid':
            document.getElementById('iframe-game').src = game.link;
            break;
        }
        document.getElementById('game-title').textContent = game.title;
      }
    });
  });

  // Обработчик кнопки "Назад"
  document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('iframe-game').src = '';
    document.getElementById('game-container').style.display = 'none';
    document.querySelector('.games-grid').style.display = 'grid';
  });
</script>

</body>
</html>
