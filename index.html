<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Decision Roulette web</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Decision Roulette web</h1>
</header>
<main>
  <section id="input-section" class="card">
    <h2>Добавьте варианты</h2>
    <div class="input-group">
      <input type="text" id="option-input" placeholder="Введите вариант" />
      <button id="add-option">Добавить</button>
    </div>
    <ul id="options-list"></ul>
  </section>
  
  <section id="roulette-section" class="card" style="display:none;">
    <h2>Выбор: <span id="current-selection">?</span></h2>
    <canvas id="roulette-canvas" width="600" height="600"></canvas>
    <div class="buttons-container">
      <button id="spin-btn" disabled>Крутить</button>
      <button id="reset-btn" style="display:none;">Сбросить</button>
    </div>
    <div id="notification"></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
