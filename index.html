<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>painter</title>
<!-- Стиль Windows 10 -->
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f0f0;
  }
  header {
    background-color: #0078D7; /* Windows 10 blue */
    color: white;
    padding: 10px;
    display: flex;
    align-items: center;
  }
  header h1 {
    margin: 0;
    font-size: 24px;
  }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    padding: 8px;
    background: #e1e1e1;
  }
  #toolbar button, select, input[type=color], input[type=range] {
    margin: 4px;
    padding: 5px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 2px;
    cursor: pointer;
  }
  #toolbar button:hover {
    background: #dcdcdc;
  }
  #canvasContainer {
    position: relative;
    background: white;
    border: 1px solid #ccc;
    height: calc(100vh - 80px);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Для некоторых элементов можно добавить стили */
</style>
</head>
<body>
<header>
  <h1>painter</h1>
</header>
<div id="toolbar">
  <!-- Инструменты -->
  <button id="pencilBtn" title="Карандаш">Карандаш</button>
  <button id="brushBtn" title="Кисть">Кисть</button>
  <button id="eraserBtn" title="Ластик">Ластик</button>
  <button id="lineBtn" title="Линия">Линия</button>
  <button id="rectBtn" title="Прямоугольник">Прямоугольник</button>
  <button id="ellipseBtn" title="Эллипс">Эллипс</button>
  <button id="fillBtn" title="Заливка">Залить</button>
  <button id="selectColorBtn" title="Цвет">Цвет</button>
  <input type="color" id="colorPicker" value="#000000" />
  <button id="undoBtn" title="Отмена">Отмена</button>
  <button id="redoBtn" title="Повтор">Повтор</button>
  <button id="saveBtn" title="Сохранить">Сохранить</button>
  <input type="file" id="loadFile" style="display:none" />
  <button id="loadBtn" title="Загрузить">Загрузить</button>
  <button id="clearBtn" title="Очистить">Очистить</button>
</div>
<div id="canvasContainer">
  <canvas id="paintCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');

let drawing = false;
let currentTool = 'pencil'; // 'pencil', 'brush', 'eraser', 'line', 'rect', 'ellipse', 'fill'
let brushColor = document.getElementById('colorPicker').value;
let brushSize = 5;
let startX = 0, startY = 0;
let savedImageData = null;
let undoStack = [];
let redoStack = [];

// Размер холста под окно
function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Обновление цвета
document.getElementById('colorPicker').onchange = (e) => {
  brushColor = e.target.value;
}

// Выбор инструментов
document.getElementById('pencilBtn').onclick = () => { currentTool = 'pencil'; };
document.getElementById('brushBtn').onclick = () => { currentTool = 'brush'; };
document.getElementById('eraserBtn').onclick = () => { currentTool = 'eraser'; };
document.getElementById('lineBtn').onclick = () => { currentTool = 'line'; };
document.getElementById('rectBtn').onclick = () => { currentTool = 'rect'; };
document.getElementById('ellipseBtn').onclick = () => { currentTool = 'ellipse'; };
document.getElementById('fillBtn').onclick = () => { currentTool = 'fill'; };

// Размер кисти
const sizeRange = document.createElement('input');
sizeRange.type = 'range';
sizeRange.min = 1;
sizeRange.max = 50;
sizeRange.value = brushSize;
sizeRange.oninput = () => { brushSize = sizeRange.value; };
document.body.appendChild(sizeRange);
document.getElementById('toolbar').appendChild(sizeRange);

// Отмена / Повтор
document.getElementById('undoBtn').onclick = () => {
  if (undoStack.length > 0) {
    redoStack.push(canvas.toDataURL());
    const dataUrl = undoStack.pop();
    const img = new Image();
    img.src = dataUrl;
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    }
  }
};
document.getElementById('redoBtn').onclick = () => {
  if (redoStack.length > 0) {
    undoStack.push(canvas.toDataURL());
    const dataUrl = redoStack.pop();
    const img = new Image();
    img.src = dataUrl;
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    }
  }
};

// Сохранение и загрузка
document.getElementById('saveBtn').onclick = () => {
  const dataUrl = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'image.png';
  a.click();
};
document.getElementById('loadBtn').onclick = () => {
  document.getElementById('loadFile').click();
};
document.getElementById('loadFile').onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

// Очистка
document.getElementById('clearBtn').onclick = () => {
  saveState();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
};

// Внутренние функции для работы с историей
function saveState() {
  undoStack.push(canvas.toDataURL());
  // очищаем redo
  redoStack = [];
}

// Основные обработчики рисования
canvas.addEventListener('mousedown', (e) => {
  saveState();
  drawing = true;
  startX = e.offsetX;
  startY = e.offsetY;

  if (currentTool === 'fill') {
    ctx.fillStyle = brushColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else if (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser') {
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.strokeStyle = currentTool === 'eraser' ? '#FFFFFF' : brushColor;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
});
canvas.addEventListener('mousemove', (e) => {
  if (!drawing) return;
  if (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser') {
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  } else {
    // Для фигур - рисуем временно на переднем плане
    redraw();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = brushColor;
    ctx.lineWidth = brushSize;
    if (currentTool === 'line') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    } else if (currentTool === 'rect') {
      ctx.strokeRect(startX, startY, e.offsetX - startX, e.offsetY - startY);
    } else if (currentTool === 'ellipse') {
      ctx.beginPath();
      ctx.ellipse((startX + e.offsetX)/2, (startY + e.offsetY)/2,
                  Math.abs(e.offsetX - startX)/2,
                  Math.abs(e.offsetY - startY)/2,
                  0, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
  }
});
canvas.addEventListener('mouseup', (e) => {
  if (!drawing) return;
  drawing = false;
  if (currentTool !== 'pencil' && currentTool !== 'brush' && currentTool !== 'eraser') {
    // Для фигур - окончательное рисование
    ctx.strokeStyle = brushColor;
    ctx.lineWidth = brushSize;
    if (currentTool === 'line') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    } else if (currentTool === 'rect') {
      ctx.strokeRect(startX, startY, e.offsetX - startX, e.offsetY - startY);
    } else if (currentTool === 'ellipse') {
      ctx.beginPath();
      ctx.ellipse((startX + e.offsetX)/2, (startY + e.offsetY)/2,
                  Math.abs(e.offsetX - startX)/2,
                  Math.abs(e.offsetY - startY)/2,
                  0, 0, Math.PI*2);
      ctx.stroke();
    }
  }
});

// Вспомогательная функция для перерисовки (чистка временных линий)
function redraw() {
  // Тут можно сохранять состояние и перерисовывать, для простоты — пропускаем
  // В более сложных реализациях нужно сохранять базовое изображение и рисовать фигуры поверх
}

// Инициализация
// Можно добавить дополнительные функции, например, заливку с помощью flood fill алгоритма, слои и т.д.

</script>
</body>
</html>
