<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Максимально точная копия BeamNG (база)</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ammo.js/builds/ammo.wasm.js"></script>

<script>
let scene, camera, renderer;
let physicsWorld;
let rigidBodies = [];
let softBodies = [];
let tempTransform;

init();
animate();

function init() {
  // Инициализация сцены
  scene = new THREE.Scene();

  // Камера
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.2, 2000);
  camera.position.set(0, 20, 50);
  camera.lookAt(0, 0, 0);

  // Освещение
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 20, 10);
  scene.add(light);

  // Рендерер
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Инициализация Ammo.js
  Ammo().then(function(AmmoLib) {
    Ammo = AmmoLib;
    setupPhysics();
    createSceneObjects();
    window.addEventListener('resize', onWindowResize, false);
  });
}

function setupPhysics() {
  const collisionConfiguration = new Ammo.btSoftBodyRigidBodyCollisionConfiguration();
  const dispatcher = new Ammo.btCollisionDispatcher(collisionConfiguration);
  const broadphase = new Ammo.btDbvtBroadphase();
  const solver = new Ammo.btSequentialImpulseConstraintSolver();
  const softBodySolver = new Ammo.btDefaultSoftBodySolver();
  physicsWorld = new Ammo.btSoftRigidDynamicsWorld(dispatcher, broadphase, solver, collisionConfiguration, softBodySolver);
  physicsWorld.setGravity(new Ammo.btVector3(0, -9.82, 0));
  physicsWorld.getWorldInfo().set_m_gravity(new Ammo.btVector3(0, -9.82, 0));
  tempTransform = new Ammo.btTransform();
}

function createSceneObjects() {
  // Создаем землю
  const groundSize = 100;
  const groundGeo = new THREE.BoxGeometry(groundSize, 1, groundSize);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
  const groundMesh = new THREE.Mesh(groundGeo, groundMat);
  groundMesh.position.y = -0.5;
  scene.add(groundMesh);

  // Физика земли
  const groundShape = new Ammo.btBoxShape(new Ammo.btVector3(groundSize/2, 0.5, groundSize/2));
  const groundBody = new Ammo.btRigidBody(
    new Ammo.btRigidBodyConstructionInfo(0, new Ammo.btDefaultMotionState(), groundShape, new Ammo.btVector3(0,0,0))
  );
  physicsWorld.addRigidBody(groundBody);

  // Создаем мягкий объект (например, сетку из мягких тел)
  createSoftBodyBox();

  // Создаем твердый блок
  createRigidBox(0, 2, 0, 2, 2, 2);
}

function createRigidBox(x, y, z, sx, sy, sz) {
  const boxGeo = new THREE.BoxGeometry(sx, sy, sz);
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
  const boxMesh = new THREE.Mesh(boxGeo, boxMat);
  boxMesh.position.set(x, y, z);
  scene.add(boxMesh);

  const boxShape = new Ammo.btBoxShape(new Ammo.btVector3(sx/2, sy/2, sz/2));
  const mass = 10;
  const localInertia = new Ammo.btVector3(0,0,0);
  boxShape.calculateLocalInertia(mass, localInertia);
  const motionState = new Ammo.btDefaultMotionState(new Ammo.btTransform(
    new Ammo.btQuaternion(0,0,0,1), new Ammo.btVector3(x,y,z)
  ));
  const rbInfo = new Ammo.btRigidBodyConstructionInfo(mass, motionState, boxShape, localInertia);
  const body = new Ammo.btRigidBody(rbInfo);
  physicsWorld.addRigidBody(body);
  boxMesh.userData.physicsBody = body;
  rigidBodies.push(boxMesh);
}

function createSoftBodyBox() {
  // Создаем мягкую сетку (например, из частиц)
  const volume = 2;
  const segments = 4;
  const softBodyHelpers = new Ammo.btSoftBodyHelpers();

  const vertices = [];
  for (let i = 0; i <= segments; i++) {
    for (let j = 0; j <= segments; j++) {
      for (let k = 0; k <= segments; k++) {
        vertices.push(new Ammo.btVector3(
          (i / segments - 0.5) * volume,
          (j / segments) * volume + 5,
          (k / segments - 0.5) * volume
        ));
      }
    }
  }

  const softBody = softBodyHelpers.CreateFromTriMesh(
    physicsWorld.getWorldInfo(),
    vertices.reduce((arr, v) => {
      arr.push(v.x()); arr.push(v.y()); arr.push(v.z());
      return arr;
    }, []),
    [],
    0
  );
  softBody.get_m_materials().at(0).set_m_kLST(0.9);
  softBody.setTotalMass(1, false);
  physicsWorld.addSoftBody(softBody, 1, -1);
  softBodies.push(softBody);
}

function onWindowResize() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  if (!Ammo) return; // еще не инициализировано

  // Управление
  handleControls();

  // Физика
  physicsWorld.stepSimulation(1/60, 10);

  // Обновляем позиции объектов
  for (let obj of rigidBodies) {
    const objPhys = obj.userData.physicsBody;
    const ms = objPhys.getMotionState();
    if (ms) {
      ms.getWorldTransform(tempTransform);
      const p = tempTransform.getOrigin();
      const q = tempTransform.getRotation();
      obj.position.set(p.x(), p.y(), p.z());
      obj.quaternion.set(q.x(), q.y(), q.z(), q.w());
    }
  }

  // Обновление мягких тел — сложный процесс, требует отдельной логики

  // Камера
  const target = scene.children.find(c => c.geometry && c.geometry.type === 'BoxGeometry' && c.material.color.getHex() === 255);
  // или просто следить за машиной или сценой

  renderer.render(scene, camera);
}

function handleControls() {
  // Тут можно реализовать управление мягкими телами и объектами
}

</script>

</body>
</html>
