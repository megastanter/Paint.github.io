<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Paint Windows 10 - расширенная версия</title>
<style>
  body {
    margin: 0;
    background: #ececec;
    font-family: Arial, sans-serif;
  }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    padding: 10px;
    background: #f1f1f1;
    border-bottom: 1px solid #ccc;
    align-items: center;
  }

  /* Инструменты */
  .tool-btn {
    margin: 0 5px;
    padding: 8px 12px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 4px;
  }
  .tool-btn.active {
    background: #d0e0f0;
  }

  /* Цвета */
  #colorPalette {
    display: flex;
    flex-wrap: wrap;
    margin-left: 10px;
  }
  .color-swatch {
    width: 24px;
    height: 24px;
    margin: 2px;
    cursor: pointer;
    border: 1px solid #000;
  }

  /* Размер кисти */
  #brushSizeContainer {
    display: flex;
    align-items: center;
    margin-left: 10px;
  }
  #brushSize {
    margin-left: 5px;
  }

  /* Основной контейнер для холста */
  #canvasContainer {
    position: relative;
    margin: auto;
    margin-top: 10px;
    border: 1px solid #ccc;
    background: #fff;
    width: 1000px;
    height: 700px;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<!-- Панель инструментов -->
<div id="toolbar">
  <button class="tool-btn" id="pencilBtn">Карандаш</button>
  <button class="tool-btn" id="brushBtn">Кисть</button>
  <button class="tool-btn" id="eraserBtn">Ластик</button>
  <button class="tool-btn" id="lineBtn">Линия</button>
  <button class="tool-btn" id="rectBtn">Прямоугольник</button>
  <button class="tool-btn" id="circleBtn">Круг</button>
  <button class="tool-btn" id="fillBtn">Заливка</button>
  <button class="tool-btn" id="undoBtn">Отменить</button>
  <button class="tool-btn" id="redoBtn">Повторить</button>
  <button class="tool-btn" id="clearBtn">Очистить</button>
  <button class="tool-btn" id="saveBtn">Сохранить</button>

  <!-- Цветовая палитра -->
  <div id="colorPalette">
    <div class="color-swatch" style="background-color:#000000;" data-color="#000000"></div>
    <div class="color-swatch" style="background-color:#FFFFFF;" data-color="#FFFFFF"></div>
    <div class="color-swatch" style="background-color:#FF0000;" data-color="#FF0000"></div>
    <div class="color-swatch" style="background-color:#00FF00;" data-color="#00FF00"></div>
    <div class="color-swatch" style="background-color:#0000FF;" data-color="#0000FF"></div>
    <div class="color-swatch" style="background-color:#FFFF00;" data-color="#FFFF00"></div>
    <div class="color-swatch" style="background-color:#FF00FF;" data-color="#FF00FF"></div>
    <div class="color-swatch" style="background-color:#00FFFF;" data-color="#00FFFF"></div>
    <!-- Добавьте больше цветов по необходимости -->
  </div>

  <!-- Размер кисти -->
  <div id="brushSizeContainer">
    <label for="brushSize">Толщина:</label>
    <input type="range" id="brushSize" min="1" max="50" value="5" />
  </div>
</div>

<!-- Холст -->
<div id="canvasContainer">
  <canvas id="paintCanvas" width="1000" height="700"></canvas>
</div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');

let drawing = false;
let currentColor = '#000000';
let brushSize = document.getElementById('brushSize').value;

let currentTool = 'pencil'; // pencil, brush, eraser, line, rect, circle, fill
let startX = 0;
let startY = 0;
let savedImageData = null;

const tools = {
  pencil: document.getElementById('pencilBtn'),
  brush: document.getElementById('brushBtn'),
  eraser: document.getElementById('eraserBtn'),
  line: document.getElementById('lineBtn'),
  rect: document.getElementById('rectBtn'),
  circle: document.getElementById('circleBtn'),
  fill: document.getElementById('fillBtn'),
  undo: document.getElementById('undoBtn'),
  redo: document.getElementById('redoBtn'),
  clear: document.getElementById('clearBtn'),
  save: document.getElementById('saveBtn')
};

let undoStack = [];
let redoStack = [];

// Выбор инструмента
Object.keys(tools).forEach(key => {
  if (tools[key]) {
    tools[key].addEventListener('click', () => {
      setActiveTool(key);
    });
  }
});

function setActiveTool(tool) {
  currentTool = tool;
  // Обновляем визуально активные кнопки
  Object.keys(tools).forEach(k => {
    if (tools[k]) {
      tools[k].classList.remove('active');
    }
  });
  if (tools[tool]) {
    tools[tool].classList.add('active');
  }
}

// Выбор цвета
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    currentColor = swatch.getAttribute('data-color');
  });
});

// Обработка изменения размера кисти
document.getElementById('brushSize').addEventListener('input', () => {
  brushSize = document.getElementById('brushSize').value;
});

// Сохраняем состояние для undo
function saveState() {
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > 20) undoStack.shift(); // лимит на стек
}

// Отменить
document.getElementById('undoBtn').addEventListener('click', () => {
  if (undoStack.length > 0) {
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    const imageData = undoStack.pop();
    ctx.putImageData(imageData, 0, 0);
  }
});

// Повторить
document.getElementById('redoBtn').addEventListener('click', () => {
  if (redoStack.length > 0) {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    const imageData = redoStack.pop();
    ctx.putImageData(imageData, 0, 0);
  }
});

// Очистить
document.getElementById('clearBtn').addEventListener('click', () => {
  saveState();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});

// Сохранить изображение
document.getElementById('saveBtn').addEventListener('click', () => {
  const dataURL = canvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.href = dataURL;
  link.download = 'paint.png';
  link.click();
});

// Основные события рисования
canvas.addEventListener('mousedown', (e) => {
  saveState();
  drawing = true;
  startX = e.offsetX;
  startY = e.offsetY;
  if (currentTool === 'fill') {
    fillCanvas(currentColor);
  } else if (currentTool === 'pencil' || currentTool === 'brush') {
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.strokeStyle = currentColor;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  } else if (currentTool === 'eraser') {
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (!drawing) return;
  drawing = false;

  if (currentTool === 'line') {
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.strokeStyle = currentColor;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  } else if (currentTool === 'rect') {
    ctx.lineWidth = brushSize;
    ctx.strokeStyle = currentColor;
    ctx.strokeRect(
      Math.min(startX, e.offsetX),
      Math.min(startY, e.offsetY),
      Math.abs(e.offsetX - startX),
      Math.abs(e.offsetY - startY)
    );
  } else if (currentTool === 'circle') {
    ctx.lineWidth = brushSize;
    ctx.strokeStyle = currentColor;
    const radius = Math.hypot(e.offsetX - startX, e.offsetY - startY);
    ctx.beginPath();
    ctx.arc(startX, startY, radius, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.closePath();
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!drawing) return;

  if (currentTool === 'pencil' || currentTool === 'brush') {
    ctx.lineWidth = brushSize;
    ctx.strokeStyle = currentColor;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  } else if (currentTool === 'eraser') {
    ctx.lineWidth = brushSize;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  } else if (currentTool === 'line' || currentTool === 'rect' || currentTool === 'circle') {
    // Для фигур — рисуем временно на новом холсте
    // Можно реализовать с помощью сохранения исходного состояния
  }
});

// Реализация заливки (функция)
function fillCanvas(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

</script>

</body>
</html>
