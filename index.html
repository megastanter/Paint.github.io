<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>painter</title>
<!-- Стиль под Windows 10 -->
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f0f0;
}
header {
  background: #0078D7;
  color: #fff;
  padding: 10px;
  display: flex;
  align-items: center;
}
header h1 {
  margin: 0;
  font-size: 24px;
}
#toolbar {
  display: flex;
  flex-wrap: wrap;
  background: #e1e1e1;
  padding: 5px;
  overflow-x: auto;
}
button, select, input[type=color], input[type=range], input[type=file] {
  margin: 2px;
  padding: 5px 10px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 2px;
  cursor: pointer;
}
button:hover {
  background: #dcdcdc;
}
#canvas-container {
  position: relative;
  height: calc(100vh - 80px);
  background: #fff;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#layers-panel {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #fff;
  border: 1px solid #999;
  max-height: 90%;
  width: 150px;
  overflow-y: auto;
  padding: 5px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
.layer-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
</style>
</head>
<body>
<header>
<h1>painter</h1>
</header>
<div id="toolbar">
  <!-- Инструменты -->
  <button id="toolPencil" title="Карандаш">Карандаш</button>
  <button id="toolBrush" title="Кисть">Кисть</button>
  <button id="toolEraser" title="Ластик">Ластик</button>
  <button id="toolLine" title="Линия">Линия</button>
  <button id="toolRect" title="Прямоугольник">Прямоугольник</button>
  <button id="toolEllipse" title="Эллипс">Эллипс</button>
  <button id="toolFill" title="Заливка">Заливка</button>
  <button id="toolText" title="Текст">Текст</button>
  <!-- Цвет -->
  <button id="colorBtn" title="Цвет">Цвет</button>
  <input type="color" id="colorPicker" value="#000000" />
  <!-- Размер кисти -->
  <button id="brushSizeBtn" title="Размер кисти">Размер</button>
  <input type="range" min="1" max="50" value="5" id="brushSizeRange"/>
  <!-- Функции -->
  <button id="undoBtn" title="Отмена">Отмена</button>
  <button id="redoBtn" title="Повтор">Повтор</button>
  <button id="saveBtn" title="Сохранить">Сохранить</button>
  <button id="loadBtn" title="Загрузить">Загрузить</button>
  <input type="file" id="loadFile" style="display:none"/>
  <button id="layersBtn" title="Слои">Слои</button>
  <button id="clearBtn" title="Очистить">Очистить</button>
</div>
<div id="canvas-container">
  <canvas id="mainCanvas"></canvas>
  <div id="layers-panel" style="display:none"></div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let layers = [];
let currentLayer = null;
let currentLayerIndex = 0;
let isDrawing = false;
let currentTool = 'pencil'; // инструмент
let currentColor = document.getElementById('colorPicker').value;
let brushSize = parseInt(document.getElementById('brushSizeRange').value);
let startX = 0, startY = 0;
let historyStack = [];
let redoStack = [];
let mode = 'draw'; // или 'fill', 'text'
let tempCanvas, tempCtx;
let showLayers = false;

// Инициализация
function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  initLayers();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function initLayers() {
  layers = [];
  createLayer('Layer 1');
  updateLayersPanel();
}
function createLayer(name='Layer') {
  const layer = document.createElement('canvas');
  layer.width = canvas.width;
  layer.height = canvas.height;
  layer.style.position='absolute';
  layer.style.top='0';
  layer.style.left='0';
  layer.dataset.name=name;
  layer.dataset.id='layer'+Date.now()+Math.random();
  document.getElementById('layers-panel').appendChild(layer);
  layers.push(layer);
  currentLayer=layer;
  currentLayerIndex=layers.length-1;
}
function updateLayersPanel() {
  const panel = document.getElementById('layers-panel');
  panel.innerHTML='';
  layers.forEach((layer, index) => {
    const item = document.createElement('div');
    item.className='layer-item';
    const checkbox = document.createElement('input');
    checkbox.type='checkbox';
    checkbox.checked=true;
    checkbox.onchange= ()=> {
      layer.style.display=checkbox.checked?'block':'none';
      draw();
    };
    item.appendChild(checkbox);
    const span=document.createElement('span');
    span.innerText=layer.dataset.name;
    item.appendChild(span);
    const btn=document.createElement('button');
    btn.innerText='X';
    btn.onclick= ()=> {
      layer.remove();
      layers.splice(index,1);
      if (currentLayer===layer) {
        currentLayer=layers[layers.length-1] || null;
        currentLayerIndex=layers.length-1;
      }
      updateLayersPanel();
      draw();
    };
    item.appendChild(btn);
    panel.appendChild(item);
  });
}
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  layers.forEach(l => {
    if (l.style.display!=='none') {
      ctx.drawImage(l,0,0);
    }
  });
}

// Выбор инструмента
document.getElementById('toolPencil').onclick= ()=> { currentTool='pencil'; mode='draw'; };
document.getElementById('toolBrush').onclick= ()=> { currentTool='brush'; mode='draw'; };
document.getElementById('toolEraser').onclick= ()=> { currentTool='eraser'; mode='draw'; };
document.getElementById('toolLine').onclick= ()=> { currentTool='line'; mode='draw'; };
document.getElementById('toolRect').onclick= ()=> { currentTool='rect'; mode='draw'; };
document.getElementById('toolEllipse').onclick= ()=> { currentTool='ellipse'; mode='draw'; };
document.getElementById('toolFill').onclick= ()=> { currentTool='fill'; mode='fill'; };
document.getElementById('toolText').onclick= ()=> { currentTool='text'; mode='text'; };

// Цвет
document.getElementById('colorBtn').onclick= ()=> { document.getElementById('colorPicker').click(); };
document.getElementById('colorPicker').onchange= ()=> {
  currentColor = document.getElementById('colorPicker').value;
};

// Размер кисти
document.getElementById('brushSizeBtn').onclick= ()=> { document.getElementById('brushSizeRange').click(); };
document.getElementById('brushSizeRange').oninput= ()=> {
  brushSize=parseInt(document.getElementById('brushSizeRange').value);
};

// История
function saveHistory() {
  draw();
  historyStack.push(canvas.toDataURL());
  if (historyStack.length>100) historyStack.shift();
}
function undo() {
  if (historyStack.length===0) return;
  redoStack.push(canvas.toDataURL());
  const data=historyStack.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayer(currentLayer);
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}
function redo() {
  if (redoStack.length===0) return;
  historyStack.push(canvas.toDataURL());
  const data=redoStack.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayer(currentLayer);
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}
function clearLayer(layer) {
  getLayerCtx(layer).clearRect(0,0,layer.width,layer.height);
}
function getLayerCtx(layer) {
  return layer.getContext('2d');
}

// Обработка мыши
canvas.addEventListener('mousedown', e => {
  saveHistory();
  isDrawing=true;
  startX=e.offsetX;
  startY=e.offsetY;
  if (mode==='fill') {
    floodFill(getLayerCtx(currentLayer), startX,startY,currentColor);
    draw();
  } else if (mode==='text') {
    const txt=prompt('Введите текст');
    if (txt) {
      const ctx=getLayerCtx(currentLayer);
      ctx.font=`${brushSize*4}px Segoe UI`;
      ctx.fillStyle=currentColor;
      ctx.fillText(txt, startX, startY);
      draw();
    }
  } else {
    const ctx=getLayerCtx(currentLayer);
    ctx.lineWidth=brushSize;
    ctx.strokeStyle=currentColor;
    ctx.fillStyle=currentColor;
    if (currentTool==='pencil'||currentTool==='brush'||currentTool==='eraser') {
      ctx.beginPath(); ctx.moveTo(startX,startY);
    }
  }
});
canvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const ctx=getLayerCtx(currentLayer);
  if (currentTool==='pencil'||currentTool==='brush'||currentTool==='eraser') {
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
    draw();
  } else {
    draw();
    drawTempShape(e);
  }
});
canvas.addEventListener('mouseup', e => {
  if (!isDrawing) return;
  isDrawing=false;
  if (['line','rect','ellipse'].includes(currentTool)) {
    drawTempShape(e,true);
  }
  draw();
});

// Временные функции
function drawTempShape(e,final=false) {
  draw();
  const ctx=getLayerCtx(currentLayer);
  ctx.lineWidth=brushSize;
  ctx.strokeStyle=currentColor;
  ctx.fillStyle=currentColor;
  const x=startX,y=startY,ex=e.offsetX,ey=e.offsetY;
  switch(currentTool) {
    case 'line':
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
      break;
    case 'rect':
      ctx.strokeRect(x,y,ex - x, ey - y);
      break;
    case 'ellipse':
      ctx.beginPath();
      ctx.ellipse((x+ex)/2, (y+ey)/2, Math.abs(ex - x)/2, Math.abs(ey - y)/2, 0, 0, Math.PI*2);
      ctx.stroke();
      break;
  }
}
function floodFill(ctx, x, y, fillColor) {
  const imageData=ctx.getImageData(0,0,ctx.canvas.width, ctx.canvas.height);
  const data=imageData.data;
  const targetColor=getColorAtPixel(data,x,y,ctx.canvas.width);
  const fillRGBA=hexToRGBA(fillColor);
  if (colorsEqual(targetColor,fillRGBA)) return;
  const stack=[{x,y}];
  while(stack.length>0) {
    const {x,y}=stack.pop();
    const currentColor=getColorAtPixel(data,x,y,ctx.canvas.width);
    if (colorsEqual(currentColor,targetColor)) {
      setColorAtPixel(data,x,y,fillRGBA,ctx.canvas.width);
      if (x+1<ctx.canvas.width) stack.push({x:x+1,y});
      if (x-1>=0) stack.push({x:x-1,y});
      if (y+1<ctx.canvas.height) stack.push({x,y:y+1});
      if (y-1>=0) stack.push({x,y:y-1});
    }
  }
  ctx.putImageData(imageData,0,0);
}
function getColorAtPixel(data,x,y,width) {
  const offset=(y*width + x)*4;
  return [data[offset],data[offset+1],data[offset+2],data[offset+3]];
}
function setColorAtPixel(data,x,y,color,width) {
  const offset=(y*width + x)*4;
  data[offset]=color[0];
  data[offset+1]=color[1];
  data[offset+2]=color[2];
  data[offset+3]=color[3];
}
function colorsEqual(c1,c2) {
  return c1[0]===c2[0] && c1[1]===c2[1] && c1[2]===c2[2] && c1[3]===c2[3];
}
function hexToRGBA(hex) {
  const r=parseInt(hex.substr(1,2),16);
  const g=parseInt(hex.substr(3,2),16);
  const b=parseInt(hex.substr(5,2),16);
  return [r,g,b,255];
}

// Кнопки функции
document.getElementById('saveBtn').onclick= ()=> {
  draw();
  const dataURL=canvas.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=dataURL;
  a.download='image.png';
  a.click();
};
document.getElementById('loadBtn').onclick= ()=> {
  document.getElementById('loadFile').click();
};
document.getElementById('loadFile').onchange= (e)=> {
  const file=e.target.files[0];
  const reader=new FileReader();
  reader.onload= ()=> {
    const img=new Image();
    img.onload= ()=> {
      clearLayers();
      getLayerCtx(currentLayer).drawImage(img,0,0);
      draw();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
};
function clearLayers() {
  layers.forEach(l=>getLayerCtx(l).clearRect(0,0,l.width,l.height));
}
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  layers.forEach(l=> {
    if (l.style.display!=='none') ctx.drawImage(l,0,0);
  });
}

// История
document.getElementById('undoBtn').onclick= ()=> { undo(); };
document.getElementById('redoBtn').onclick= ()=> { redo(); };

function saveHistory() {
  draw();
  historyStack.push(canvas.toDataURL());
  if (historyStack.length>200) historyStack.shift();
}
function undo() {
  if (historyStack.length===0) return;
  redoStack.push(canvas.toDataURL());
  const data=historyStack.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayers();
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}
function redo() {
  if (redoStack.length===0) return;
  historyStack.push(canvas.toDataURL());
  const data=redoStack.pop();
  const img=new Image();
  img.onload= ()=> {
    clearLayers();
    getLayerCtx(currentLayer).drawImage(img,0,0);
    draw();
  };
  img.src=data;
}

// Очистка
document.getElementById('clearBtn').onclick= ()=> {
  saveHistory();
  layers.forEach(l=>getLayerCtx(l).clearRect(0,0,l.width,l.height));
  draw();
}
</script>
</div>
</body>
</html>
