<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Городские гонки — стартовая версия</title>
<style>
  body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #222; }
  #gameCanvas { display: block; margin: 0 auto; background: #111; }
  #ui { position: absolute; top: 10px; left: 20px; color: #fff; font-size: 18px; z-index: 10; }
  #shopBtn { position: absolute; top: 10px; right: 20px; padding: 8px 16px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  #shop { position: absolute; top: 50px; right: 20px; width: 350px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; display: none; color: #fff; max-height: 400px; overflow-y: auto; }
  #shop h2 { margin-top: 0; }
  .car-option { margin: 10px 0; cursor: pointer; display: flex; align-items: center; transition: background 0.3s; padding: 8px; border-radius: 4px; }
  .car-option:hover { background: #444; }
  .car-option img { width: 60px; height: 40px; margin-right: 10px; }
</style>
</head>
<body>

<div id="ui">
  <div id="status">Статус: В городе</div>
  <div id="money">Деньги: 0</div>
</div>
<button id="shopBtn">Магазин</button>
<div id="shop">
  <h2>Магазин машин</h2>
  <div class="car-option" data-price="100" data-model="basic" data-color="#3399ff" data-name="Стандартная">
    <img src="https://i.imgur.com/UbkU7bE.png" alt="Basic Car" />
    <div>Стандартная — 100</div>
  </div>
  <div class="car-option" data-price="300" data-model="sport" data-color="#ff3333" data-name="Спорткар">
    <img src="https://i.imgur.com/4hY0E7n.png" alt="Sport Car" />
    <div>Спорткар — 300</div>
  </div>
  <div class="car-option" data-price="600" data-model="luxury" data-color="#ffd700" data-name="Люкс">
    <img src="https://i.imgur.com/8IuMDmW.png" alt="Luxury Car" />
    <div>Люкс — 600</div>
  </div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const statusDiv = document.getElementById('status');
const moneyDiv = document.getElementById('money');
const shopBtn = document.getElementById('shopBtn');
const shop = document.getElementById('shop');

let money = 0;
let gameState = 'city'; // 'city', 'race', 'menu'
let cars = [];
let playerCar = null;
let raceDistance = 0;
let raceFinished = false;
let raceTimer = 0;
let currentRaceReward = 0;
let inRace = false;

const cityPaths = [
  { x: 400, y: 0, width: 200, height: 600, color: '#444' },
  { x: 0, y: 0, width: 200, height: 600, color: '#444' },
  { x: 200, y: 0, width: 200, height: 600, color: '#444' },
  { x: 600, y: 0, width: 200, height: 600, color: '#444' }
];

class Car {
  constructor(x, y, color, name='') {
    this.x = x;
    this.y = y;
    this.speed = 0;
    this.maxSpeed = 4 + Math.random() * 2;
    this.color = color;
    this.width = 50;
    this.height = 30;
    this.name = name;
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.strokeStyle = '#222';
    ctx.strokeRect(this.x, this.y, this.width, this.height);
  }

  update() {
    this.y -= this.speed;
    if (this.y < -50) this.y = canvas.height + Math.random()*200;
  }
}

// Инициализация
function init() {
  // Создаем машины
  cars = [
    new Car(100, 500, '#00f', 'Игрок'),
    new Car(300, 550, '#f00', 'Враг'),
    new Car(500, 600, '#0f0', 'Враг')
  ];
  playerCar = cars[0];

  // Обработка покупки машин
  document.querySelectorAll('.car-option').forEach(div => {
    div.onclick = () => {
      const price = +div.dataset.price;
      if (money >= price) {
        money -= price;
        const color = div.dataset.color;
        playerCar.color = color;
        alert(`Вы купили ${div.dataset.name}`);
        updateUI();
      } else {
        alert('Недостаточно денег!');
      }
    };
  });
  shop.style.display = 'none';
  gameState = 'city';
  requestAnimationFrame(gameLoop);
}

// Обновление UI
function updateUI() {
  document.getElementById('money').innerText = 'Деньги: ' + money;
}

// Основной цикл
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === 'city') {
    drawCity();
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.fillText('Нажмите ENTER, чтобы начать гонку', 200, 300);
    requestAnimationFrame(gameLoop);
  } else if (gameState === 'race') {
    runRace();
  }
}

// Рисуем город
function drawCity() {
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let path of cityPaths) {
    ctx.fillStyle = '#555';
    ctx.fillRect(path.x, path.y, path.width, path.height);
  }

  // Дороги
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.strokeRect(0, 0, canvas.width, canvas.height);
  ctx.setLineDash([]);
}

// Запуск гонки
function startRace() {
  gameState = 'race';
  raceDistance = 0;
  raceFinished = false;
  raceTimer = 0;
  currentRaceReward = Math.floor(100 + Math.random() * 200);
  // Ускорение машин
  for (let car of cars) {
    car.speed = car.maxSpeed;
  }
}

// Обработка нажатий
window.addEventListener('keydown', e => {
  if (gameState === 'city') {
    if (e.key === 'Enter') {
      startRace();
    }
  } else if (gameState === 'race') {
    if (e.key === 'ArrowLeft') {
      playerCar.x -= 20;
      if (playerCar.x < 0) playerCar.x = 0;
    } else if (e.key === 'ArrowRight') {
      playerCar.x += 20;
      if (playerCar.x + playerCar.width > canvas.width) playerCar.x = canvas.width - playerCar.width;
    }
  }
});

// Гонка
function runRace() {
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Обновляем и рисуем машины
  for (let car of cars) {
    if (car !== playerCar) {
      // Враг движется к финишу
      if (car.y > 100) {
        car.y -= 0.5 + Math.random() * 0.5;
      }
    }
    car.draw();

    // Проверка финиша
    if (car === playerCar && car.y <= 50 && !raceFinished) {
      raceFinished = true;
      endRace(true);
      break;
    }
    if (car !== playerCar && car.y <= 50 && !raceFinished) {
      raceFinished = true;
      endRace(false);
      break;
    }
  }

  // Обновляем позицию игрока
  ctx.fillStyle = playerCar.color;
  ctx.fillRect(playerCar.x, playerCar.y, playerCar.width, playerCar.height);
  ctx.strokeStyle = '#222';
  ctx.strokeRect(playerCar.x, playerCar.y, playerCar.width, playerCar.height);

  // Обновляем
  if (!raceFinished) {
    requestAnimationFrame(runRace);
  }
}

// Конец гонки
function endRace(win) {
  if (win) {
    alert(`Вы выиграли! Получаете ${currentRaceReward} денег`);
    money += currentRaceReward;
    updateUI();
  } else {
    alert('Проигрыш! Попробуйте снова.');
  }
  // Возвращаемся в город
  gameState = 'city';
  requestAnimationFrame(gameLoop);
}

// Запуск
init();

</script>
</body>
</html>
