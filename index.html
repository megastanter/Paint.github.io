<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мини-версия BeamNG Drive</title>
<style>
  body {
    margin: 0;
    background: #222;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  #gameCanvas {
    display: block;
    background: #444;
  }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px;
    border-radius: 8px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="1200" height="700"></canvas>
<div id="info">Управление: стрелки - движение, пробел - тормоз, R - перезапуск</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let keys = {};

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// Простая физика и объекты
class Car {
  constructor() {
    this.x = 100;
    this.y = 100;
    this.width = 60;
    this.height = 30;
    this.angle = 0;
    this.speed = 0;
    this.maxSpeed = 4;
    this.acceleration = 0.1;
    this.friction = 0.98;
    this.color = 'red';
    this.health = 100;
  }

  update() {
    if (keys['arrowup']) {
      this.speed += this.acceleration;
    }
    if (keys['arrowdown']) {
      this.speed -= this.acceleration;
    }
    if (keys['arrowleft']) {
      this.angle -= 0.03;
    }
    if (keys['arrowright']) {
      this.angle += 0.03;
    }
    if (keys[' ']) {
      this.speed *= 0.95; // тормоз
    }

    // ограничения скорости
    if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
    if (this.speed < -this.maxSpeed/2) this.speed = -this.maxSpeed/2;

    // физика
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;

    this.speed *= this.friction;

    // границы
    if (this.x < 0) this.x = 0;
    if (this.y < 0) this.y = 0;
    if (this.x > canvas.width) this.x = canvas.width;
    if (this.y > canvas.height) this.y = canvas.height;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
    ctx.restore();
  }
}

class Obstacle {
  constructor(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.width = w;
    this.height = h;
  }

  draw() {
    ctx.fillStyle = '#555';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }
}

const playerCar = new Car();

const obstacles = [
  new Obstacle(300, 200, 200, 50),
  new Obstacle(700, 500, 150, 150),
  new Obstacle(500, 300, 50, 200),
  new Obstacle(1000, 100, 80, 80)
];

function detectCollision(car, obstacle) {
  // проверка столкновения по осям
  const rect1 = {
    x: car.x - car.width/2,
    y: car.y - car.height/2,
    w: car.width,
    h: car.height
  };
  const rect2 = obstacle;

  return (
    rect1.x < rect2.x + rect2.w &&
    rect1.x + rect1.w > rect2.x &&
    rect1.y < rect2.y + rect2.h &&
    rect1.y + rect1.h > rect2.y
  );
}

function handleCollisions() {
  for (let obs of obstacles) {
    if (detectCollision(playerCar, obs)) {
      // простая реакция — уменьшение здоровья и отскок
      playerCar.health -= 1;
      // отскок
      playerCar.speed = -playerCar.speed * 0.5;
    }
  }
}

function resetGame() {
  playerCar.x = 100;
  playerCar.y = 100;
  playerCar.speed = 0;
  playerCar.angle = 0;
  playerCar.health = 100;
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // управление
  if (keys['r']) {
    resetGame();
  }

  playerCar.update();
  handleCollisions();

  // рисуем
  for (let obs of obstacles) {
    obs.draw();
  }
  playerCar.draw();

  // информация
  ctx.fillStyle = 'white';
  ctx.font = '20px Arial';
  ctx.fillText(`Здоровье: ${playerCar.health}`, 20, 30);

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
