<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Рулетка судьбы</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    color: #fff;
  }

  h1 {
    margin: 20px 0;
    font-size: 2.5em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    text-align: center;
  }

  #container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 600px;
    width: 90%;
  }

  #roulette-wrapper {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 20px 0;
  }

  #roulette {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    cursor: pointer;
    position: relative;
    background: #444;
    overflow: hidden;
  }

  #pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; 
    height: 0; 
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-bottom: 40px solid #fff;
    z-index: 10;
  }

  #result {
    font-size: 1.8em;
    margin-top: 20px;
    min-height: 2em;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    text-align: center;
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    justify-content: center;
    width: 100%;
  }

  button {
    padding: 12px 24px;
    font-size: 1.1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #fff;
    color: #333;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: background 0.3s, transform 0.2s;
  }

  button:hover {
    background-color: #ddd;
    transform: translateY(-2px);
  }

  input[type="text"] {
    padding: 10px;
    font-size: 1em;
    border-radius: 6px;
    border: 2px solid #ccc;
    width: 200px;
  }

  @media(max-width: 500px){
    #roulette-wrapper {
      width: 90%;
      height: auto;
    }
  }
</style>
</head>
<body>

<h1>Рулетка судьбы</h1>

<div id="container">
  <div id="roulette-wrapper">
    <div id="pointer"></div>
    <div id="roulette"></div>
  </div>
  <div id="result">Нажмите на рулетку или кнопку "Крутить", чтобы начать</div>
  <div id="controls">
    <button id="spinBtn">Крутить</button>
    <button id="addSectorBtn">Добавить сектор</button>
    <input type="text" id="newSectorInput" placeholder="Новый сектор" />
  </div>
</div>

<script>
  const sectors = [
    'Счастье', 'Беда', 'Удача', 'Неудача', 'Золото', 'Бронза', 'Счастье', 'Провал'
  ];

  const roulette = document.getElementById('roulette');
  const resultDiv = document.getElementById('result');
  const spinBtn = document.getElementById('spinBtn');
  const addSectorBtn = document.getElementById('addSectorBtn');
  const newSectorInput = document.getElementById('newSectorInput');

  let isSpinning = false;

  // Создаем сектора
function createSegments() {
    roulette.innerHTML = '';
    const count = sectors.length;
    if (count === 0) {
      resultDiv.innerText = 'Добавьте сектора для вращения!';
      return;
    }
    const anglePerSector = 360 / count;
    sectors.forEach((sector, index) => {
      const segment = document.createElement('div');
      segment.innerText = sector;
      segment.style.position = 'absolute';
      segment.style.width = '50%';
      segment.style.height = '50%';
      segment.style.top = '50%';
      segment.style.left = '50%';
      segment.style.transformOrigin = '0% 0%';
      segment.style.transform = `rotate(${index * anglePerSector}deg) skewY(-${90 - anglePerSector}deg)`;
      segment.style.backgroundColor = index % 2 === 0 ? '#ffcc00' : '#ff6600';
      segment.style.border = '1px solid #fff';
      segment.style.display = 'flex';
      segment.style.alignItems = 'flex-start';
      segment.style.justifyContent = 'center';
      segment.style.padding = '10px';
      segment.style.boxSizing = 'border-box';
      segment.style.fontSize = '0.9em';
      segment.style.fontWeight = 'bold';
      roulette.appendChild(segment);
    });
  }

function spin() {
    if (isSpinning || sectors.length === 0) return;
    isSpinning = true;
    resultDiv.innerText = '';

    const count = sectors.length;
    const anglePerSector = 360 / count;
    const spinsCount = Math.floor(Math.random() * 3) + 4; // минимум 4 круга
    const randomIndex = Math.floor(Math.random() * count);
    const stopAngle = 360 * spinsCount + (count - randomIndex) * anglePerSector + anglePerSector / 2;

    // Запускаем анимацию
    roulette.style.transition = 'transform 4s cubic-bezier(0.33, 1, 0.68, 1)';
    roulette.style.transform = `rotate(${stopAngle}deg)`;

    // После окончания вращения
    setTimeout(() => {
      const normalizedDeg = stopAngle % 360;
      const index = Math.floor(normalizedDeg / anglePerSector);
      const resultSector = sectors[(sectors.length - index) % sectors.length];
      resultDiv.innerText = `Вам выпало: ${resultSector}`;
      isSpinning = false;
    }, 4000);
  }

function addSector() {
    const newSector = newSectorInput.value.trim();
    if (newSector && !sectors.includes(newSector)) {
      sectors.push(newSector);
      createSegments();
      newSectorInput.value = '';
    } else {
      alert('Введите уникальное название сектора');
    }
  }

createSegments();

document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('addSectorBtn').addEventListener('click', addSector);
document.getElementById('roulette').addEventListener('click', spin);
</script>

</body>
</html>
