<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paint Web</title>
<style>
  body {
    margin: 0;
    background: #282c34;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #toolbar {
    display: flex;
    background: #444;
    padding: 10px;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  button, input[type=color], input[type=range] {
    font-family: Arial, sans-serif;
    font-size: 14px;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background: #666;
  }
  #canvasContainer {
    position: relative;
    border: 2px solid #555;
    margin-top: 10px;
  }
  #paintCanvas {
    background: #fff;
    display: block;
  }
  #status {
    margin: 10px;
    color: #fff;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="brushBtn">Кисть</button>
  <button id="eraserBtn">Ластик</button>
  <button id="clearBtn">Очистить</button>
  <button id="saveBtn">Сохранить</button>
  <label>Цвет:
    <input type="color" id="colorPicker" value="#000000" />
  </label>
  <label>Размер:
    <input type="range" id="sizeRange" min="1" max="50" value="5" />
  </label>
</div>

<div id="canvasContainer">
  <canvas id="paintCanvas" width="1000" height="700"></canvas>
</div>

<div id="status">Инструмент: Кисть | Цвет: #000000 | Размер: 5</div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');

let drawing = false;
let currentTool = 'brush'; // 'brush' или 'eraser'
let currentColor = document.getElementById('colorPicker').value;
let brushSize = document.getElementById('sizeRange').value;

// Обновление цвета и размера
document.getElementById('colorPicker').addEventListener('change', () => {
  currentColor = document.getElementById('colorPicker').value;
  updateStatus();
});
document.getElementById('sizeRange').addEventListener('input', () => {
  brushSize = document.getElementById('sizeRange').value;
  updateStatus();
});

// Инструменты
document.getElementById('brushBtn').onclick = () => { currentTool='brush'; updateStatus(); };
document.getElementById('eraserBtn').onclick = () => { currentTool='eraser'; updateStatus(); };
document.getElementById('clearBtn').onclick = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); };
document.getElementById('saveBtn').onclick = () => {
  const dataURL = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'my_drawing.png';
  a.click();
};

function updateStatus() {
  document.getElementById('status').textContent = 
    `Инструмент: ${currentTool === 'brush' ? 'Кисть' : 'Ластик'} | Цвет: ${currentColor} | Размер: ${brushSize}`;
}

// Рисование
canvas.addEventListener('mousedown', (e) => {
  drawing = true;
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = currentTool === 'eraser' ? '#fff' : currentColor;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
});
canvas.addEventListener('mouseup', () => {
  drawing = false;
});
canvas.addEventListener('mouseout', () => {
  drawing = false;
});
canvas.addEventListener('mousemove', (e) => {
  if (!drawing) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
});

</script>

</body>
</html>
