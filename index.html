<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Painter</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #c0c0c0;
  }

  /* Заголовок */
  #title {
    background: #0078D7;
    color: white;
    padding: 8px 12px;
    font-size: 20px;
    font-weight: bold;
  }

  /* Верхняя панель с кнопками */
  #toolbar {
    display: flex;
    background: #e0e0e0;
    padding: 4px;
    align-items: center;
  }

  /* Основные кнопки */
  button {
    margin: 0 4px;
    padding: 4px 8px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Цвет и размер */
  input[type=color], input[type=range] {
    margin: 0 8px;
    cursor: pointer;
  }

  /* Холст контейнер */
  #canvasContainer {
    position: relative;
    border: 1px solid #888;
    margin: 4px;
  }

  /* Холст */
  #paintCanvas {
    display: block;
    background: #fff;
  }
</style>
</head>
<body>

<div id="title">Painter</div>

<!-- Панель инструментов -->
<div id="toolbar">
  <button id="btnPencil" title="Кисть">Кисть</button>
  <button id="btnLine" title="Линия">Линия</button>
  <button id="btnRectangle" title="Прямоугольник">Прямоугольник</button>
  <button id="btnEllipse" title="Эллипс">Эллипс</button>
  <button id="btnErase" title="Ластик">Ластик</button>
  <button id="btnClear" title="Очистить">Очистить</button>
  <label>Цвет: <input type="color" id="colorPicker" value="#000000"></label>
  <label>Толщина: <input type="range" id="sizeRange" min="1" max="20" value="3"></label>
</div>

<!-- Холст -->
<div id="canvasContainer">
  <canvas id="paintCanvas" width="1200" height="700"></canvas>
</div>

<script>
  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d');

  const colorPicker = document.getElementById('colorPicker');
  const sizeRange = document.getElementById('sizeRange');

  const btnPencil = document.getElementById('btnPencil');
  const btnLine = document.getElementById('btnLine');
  const btnRectangle = document.getElementById('btnRectangle');
  const btnEllipse = document.getElementById('btnEllipse');
  const btnErase = document.getElementById('btnErase');
  const btnClear = document.getElementById('btnClear');

  let currentTool = 'pencil'; // по умолчанию
  let isDrawing = false;
  let startX = 0;
  let startY = 0;

  // Установка выбранного инструмента
  document.querySelectorAll('#toolbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTool = btn.id.replace('btn', '').toLowerCase();
    });
  });

  // Очистка холста
  document.getElementById('btnClear').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // Начало рисования
  canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    startX = e.offsetX;
    startY = e.offsetY;

    if (currentTool === 'pencil' || currentTool === 'eraser') {
      ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(startX, startY);
    }
  });

  // В процессе рисования
  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;

    const x = e.offsetX;
    const y = e.offsetY;
    ctx.lineWidth = sizeRange.value;

    if (currentTool === 'pencil' || currentTool === 'eraser') {
      ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : colorPicker.value;
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  });

  // Конец рисования
  canvas.addEventListener('mouseup', (e) => {
    if (!isDrawing) return;
    isDrawing = false;

    if (currentTool === 'line') {
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    } else if (currentTool === 'rectangle') {
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.strokeRect(startX, startY, e.offsetX - startX, e.offsetY - startY);
    } else if (currentTool === 'ellipse') {
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      const centerX = (startX + e.offsetX) / 2;
      const centerY = (startY + e.offsetY) / 2;
      const radiusX = Math.abs(e.offsetX - startX) / 2;
      const radiusY = Math.abs(e.offsetY - startY) / 2;
      ctx.beginPath();
      ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);
      ctx.stroke();
    }
  });

  // Иногда для корректной отрисовки можно добавлять событие mouseout
  canvas.addEventListener('mouseout', () => {
    isDrawing = false;
  });
</script>
</body>
</html>
