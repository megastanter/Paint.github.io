<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Traffic Racer Web</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #222;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #444;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 24px;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="score">Очки: 0</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: '#444',
    physics: {
        default: 'arcade',
        arcade: {
            debug: false,
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

let player;
let cars;
let roadLines;
let cursors;
let score = 0;
let scoreText;
let gameOver = false;

function preload() {
    this.load.image('playerCar', 'https://i.imgur.com/7k8rHjV.png'); // Модель авто игрока
    this.load.image('car', 'https://i.imgur.com/6z7iRzR.png'); // Модель вражеской машины
    this.load.image('roadLine', 'https://i.imgur.com/0dQ4QXh.png'); // Линии разметки
}

function create() {
    // Создаем дорожную разметку
    roadLines = this.physics.add.group();
    for (let i = 0; i < 10; i++) {
        let line = roadLines.create(400, i * 60, 'roadLine');
        line.setOrigin(0.5, 0.5);
        line.setDisplaySize(10, 50);
        line.setImmovable(true);
    }

    // Создаем игрока
    player = this.physics.add.sprite(400, 500, 'playerCar');
    player.setCollideWorldBounds(true);
    player.setDisplaySize(50, 100);

    // Группа вражеских машин
    cars = this.physics.add.group();

    // Создаем управление
    cursors = this.input.keyboard.createCursorKeys();

    // Коллизия
    this.physics.add.overlap(player, cars, hitCar, null, this);

    // Очки
    score = 0;
    scoreText = document.getElementById('score');

    // Таймер появления машин
    this.time.addEvent({
        delay: 1000,
        callback: spawnCar,
        callbackScope: this,
        loop: true
    });
}

function update() {
    if (gameOver) {
        return;
    }

    // Движение линии дорожной разметки
    roadLines.children.iterate(function(line) {
        line.y += 5;
        if (line.y > 600) {
            line.y = -50;
        }
    });

    // Управление игроком
    if (cursors.left.isDown) {
        player.setVelocityX(-200);
    } else if (cursors.right.isDown) {
        player.setVelocityX(200);
    } else {
        player.setVelocityX(0);
    }

    // Передвижение вражеских машин
    cars.children.iterate(function(car) {
        car.y += 5;
        if (car.y > 600) {
            car.destroy();
            score += 10;
            scoreText.innerText = 'Очки: ' + score;
        }
    });
}

function spawnCar() {
    const laneXPositions = [200, 400, 600];
    const x = Phaser.Utils.Array.GetRandom(laneXPositions);
    const car = cars.create(x, -100, 'car');
    car.setDisplaySize(50, 100);
    car.setVelocityY(0);
}

function hitCar(player, car) {
    this.physics.pause();
    player.setTint(0xff0000);
    gameOver = true;
    alert('Игра окончена! Ваши очки: ' + score);
}
</script>
</body>
</html>
