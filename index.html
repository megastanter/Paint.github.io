<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Калькулятор</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #ffe5b4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  /* Основной стиль калькулятора */
  .calculator {
    background-color: #ff6347;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    width: 320px;
    margin-bottom: 30px;
  }

  .display {
    background-color: #ff7f50;
    padding: 10px;
    font-size: 24px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: right;
    color: #fff;
    min-height: 40px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #ff8c00;
    color: #fff;
    transition: background-color 0.2s;
  }

  button:hover {
    background-color: #ff7000;
  }

  .operator {
    background-color: #dc143c;
  }

  .operator:hover {
    background-color: #b22222;
  }

  .clear {
    background-color: #a0522d;
  }

  .clear:hover {
    background-color: #8b4513;
  }

  /* Стиль для конвертера */
  .converter {
    background-color: #ff6347;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    width: 360px;
    margin-bottom: 30px;
  }

  .converter h2 {
    text-align: center;
    margin-bottom: 15px;
  }

  /* Категории */
  .categories {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    margin-bottom: 10px;
  }

  .category-btn {
    padding: 8px 12px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background-color: #ffa500;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .category-btn:hover {
    background-color: #ff8c00;
  }

  /* Внутри конвертера */
  #conversionSection {
    display: none;
  }

  .active {
    display: block;
  }

  input[type=number] {
    width: calc(50% - 10px);
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-right: 10px;
  }

  select {
    width: calc(50% - 10px);
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-top: 10px;
  }

  .convert-btn {
    display: block;
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #ff8c00;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .convert-btn:hover {
    background-color: #ff7000;
  }

  .result {
    margin-top: 10px;
    font-size: 18px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Калькулятор -->
<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="setOperation('+')">+</button>
    
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="operator" onclick="setOperation('-')">-</button>
    
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="operator" onclick="setOperation('*')">&times;</button>
    
    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button onclick="calculate()" style="grid-column: span 2;">=</button>
    <button class="operator" onclick="setOperation('/')">/</button>
  </div>
</div>

<!-- Расширенный конвертер -->
<div class="converter">
  <h2>Расширенный конвертер</h2>
  <div class="categories">
    <button class="category-btn" onclick="showCategory('temp')">Температура</button>
    <button class="category-btn" onclick="showCategory('currency')">Валюта</button>
    <button class="category-btn" onclick="showCategory('length')">Длина</button>
    <button class="category-btn" onclick="showCategory('mass')">Масса</button>
    <button class="category-btn" onclick="showCategory('area')">Площадь</button>
    <button class="category-btn" onclick="showCategory('time')">Время</button>
    <button class="category-btn" onclick="showCategory('volume')">Объем</button>
    <button class="category-btn" onclick="showCategory('speed')">Скорость</button>
    <button class="category-btn" onclick="showCategory('finance')">Финансы</button>
    <button class="category-btn" onclick="showCategory('date')">Дата</button>
    <button class="category-btn" onclick="showCategory('discount')">Скидка</button>
  </div>

  <!-- Раздел для разных категорий -->
  <div id="conversionSection">

    <!-- Температура -->
    <div id="temp" class="categoryContent">
      <input type="number" id="tempInput" placeholder="Введите значение" />
      <select id="tempFrom">
        <option value="C">Цельсий (°C)</option>
        <option value="F">Фаренгейт (°F)</option>
      </select>
      <button class="convert-btn" onclick="convertTemperature()">Конвертировать</button>
      <div class="result" id="tempResult"></div>
    </div>

    <!-- Валюта (пример, фиксированный курс) -->
    <div id="currency" class="categoryContent" style="display:none;">
      <input type="number" id="currencyInput" placeholder="Введите сумму" />
      <select id="currencyFrom">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="RUB">RUB</option>
      </select>
      <button class="convert-btn" onclick="convertCurrency()">Конвертировать</button>
      <div class="result" id="currencyResult"></div>
    </div>

    <!-- Длина -->
    <div id="length" class="categoryContent" style="display:none;">
      <input type="number" id="lengthInput" placeholder="Введите значение" />
      <select id="lengthFrom">
        <option value="m">Метр (м)</option>
        <option value="km">Километр (км)</option>
        <option value="cm">Сантиметр (см)</option>
        <option value="mile">Миля</option>
        <option value="yard">Ярд</option>
        <option value="ft">Фут</option>
      </select>
      <button class="convert-btn" onclick="convertLength()">Конвертировать</button>
      <div class="result" id="lengthResult"></div>
    </div>

    <!-- Масса -->
    <div id="mass" class="categoryContent" style="display:none;">
      <input type="number" id="massInput" placeholder="Введите значение" />
      <select id="massFrom">
        <option value="kg">Килограмм (кг)</option>
        <option value="g">Грамм (г)</option>
        <option value="lb">Фунт</option>
        <option value="oz">Унция</option>
      </select>
      <button class="convert-btn" onclick="convertMass()">Конвертировать</button>
      <div class="result" id="massResult"></div>
    </div>

    <!-- Площадь -->
    <div id="area" class="categoryContent" style="display:none;">
      <input type="number" id="areaInput" placeholder="Введите значение" />
      <select id="areaFrom">
        <option value="sq_m">Кв.метр</option>
        <option value="sq_km">Кв.километр</option>
        <option value="hectare">Гектар</option>
        <option value="sq_mile">Кв.мили</option>
        <option value="sq_yard">Кв.ярд</option>
      </select>
      <button class="convert-btn" onclick="convertArea()">Конвертировать</button>
      <div class="result" id="areaResult"></div>
    </div>

    <!-- Время -->
    <div id="time" class="categoryContent" style="display:none;">
      <input type="number" id="timeInput" placeholder="Введите значение" />
      <select id="timeFrom">
        <option value="sec">Секунда</option>
        <option value="min">Минута</option>
        <option value="hour">Час</option>
        <option value="day">День</option>
        <option value="year">Год</option>
      </select>
      <button class="convert-btn" onclick="convertTime()">Конвертировать</button>
      <div class="result" id="timeResult"></div>
    </div>

    <!-- Объем -->
    <div id="volume" class="categoryContent" style="display:none;">
      <input type="number" id="volumeInput" placeholder="Введите значение" />
      <select id="volumeFrom">
        <option value="l">Литр</option>
        <option value="ml">Миллилитр</option>
        <option value="m3">Кубический метр</option>
        <option value="gal">Галлон</option>
        <option value="cup">Чашка</option>
      </select>
      <button class="convert-btn" onclick="convertVolume()">Конвертировать</button>
      <div class="result" id="volumeResult"></div>
    </div>

    <!-- Скорость -->
    <div id="speed" class="categoryContent" style="display:none;">
      <input type="number" id="speedInput" placeholder="Введите значение" />
      <select id="speedFrom">
        <option value="mps">м/с</option>
        <option value="kmph">км/ч</option>
        <option value="mph">миль/ч</option>
        <option value="knot">узел</option>
      </select>
      <button class="convert-btn" onclick="convertSpeed()">Конвертировать</button>
      <div class="result" id="speedResult"></div>
    </div>

  </div>
</div>

<script>
  // Функция переключения категорий
  function showCategory(category) {
    const categories = document.querySelectorAll('.categoryContent');
    categories.forEach(cat => {
      cat.style.display = 'none';
    });
    document.getElementById(category).style.display = 'block';
  }

  // Изначально показываем температуру
  showCategory('temp');

  // Функции калькулятора
  let currentInput = '0';
  let previousInput = '';
  let operation = null;

  const display = document.getElementById('display');

  function updateDisplay() {
    display.innerText = currentInput;
  }

  function appendNumber(number) {
    if (currentInput === '0' && number !== '.') {
      currentInput = number;
    } else {
      currentInput += number;
    }
    updateDisplay();
  }

  function setOperation(op) {
    if (operation !== null) {
      calculate();
    }
    previousInput = currentInput;
    currentInput = '0';
    operation = op;
  }

  function calculate() {
    let prev = parseFloat(previousInput);
    let current = parseFloat(currentInput);
    if (isNaN(prev) || isNaN(current)) return;

    let result;
    switch (operation) {
      case '+':
        result = prev + current;
        break;
      case '-':
        result = prev - current;
        break;
      case '*':
        result = prev * current;
        break;
      case '/':
        result = current === 0 ? 'Ошибка' : prev / current;
        break;
      default:
        return;
    }
    currentInput = result.toString();
    operation = null;
    updateDisplay();
  }

  function clearDisplay() {
    currentInput = '0';
    previousInput = '';
    operation = null;
    updateDisplay();
  }

  // Конвертер температуры
  function convertTemperature() {
    const inputValue = parseFloat(document.getElementById('tempInput').value);
    const fromUnit = document.getElementById('tempFrom').value;
    const resultDiv = document.getElementById('tempResult');

    if (isNaN(inputValue)) {
      resultDiv.innerText = 'Пожалуйста, введите число.';
      return;
    }

    let convertedValue;
    if (fromUnit === 'C') {
      convertedValue = (inputValue * 9/5) + 32;
      resultDiv.innerText = `${inputValue}°C = ${convertedValue.toFixed(2)}°F`;
    } else {
      convertedValue = (inputValue - 32) * 5/9;
      resultDiv.innerText = `${inputValue}°F = ${convertedValue.toFixed(2)}°C`;
    }
  }

  // Валюта (примерный курс, можно обновлять)
  function convertCurrency() {
    const amount = parseFloat(document.getElementById('currencyInput').value);
    const from = document.getElementById('currencyFrom').value;
    const rates = {
      USD: { EUR: 0.85, RUB: 75 },
      EUR: { USD: 1.18, RUB: 88 },
      RUB: { USD: 0.013, EUR: 0.011 }
    };
    const resultDiv = document.getElementById('currencyResult');

    if (isNaN(amount)) {
      resultDiv.innerText = 'Пожалуйста, введите сумму.';
      return;
    }

    // Конвертация в другую валюту (например, EUR или RUB)
    let targetCurrencies = Object.keys(rates[from]);
    let results = targetCurrencies.map(target => {
      let rate = rates[from][target];
      return `${target}: ${(amount * rate).toFixed(2)}`;
    });
    resultDiv.innerText = results.join(', ');
  }

  // Длина
  function convertLength() {
    const value = parseFloat(document.getElementById('lengthInput').value);
    const fromUnit = document.getElementById('lengthFrom').value;
    const toUnits = {
      m: 1,
      km: 1000,
      cm: 0.01,
      mile: 1609.34,
      yard: 0.9144,
      ft: 0.3048
    };

    const resultDiv = document.getElementById('lengthResult');

    if (isNaN(value)) {
      resultDiv.innerText = 'Пожалуйста, введите число.';
      return;
    }

    const inMeters = value * toUnits[fromUnit];
    let results = Object.entries(toUnits).map(([unit, factor]) => {
      if (unit !== fromUnit) {
        return `${unit}: ${(inMeters / factor).toFixed(4)}`;
      }
    }).filter(Boolean);
    resultDiv.innerText = results.join(', ');
  }

  // Масса
  function convertMass() {
    const value = parseFloat(document.getElementById('massInput').value);
    const fromUnit = document.getElementById('massFrom').value;
    const toUnits = {
      kg: 1,
      g: 0.001,
      lb: 0.453592,
      oz: 0.0283495
    };

    const resultDiv = document.getElementById('massResult');

    if (isNaN(value)) {
      resultDiv.innerText = 'Пожалуйста, введите число.';
      return;
    }

    const inKg = value * toUnits[fromUnit];
    let results = Object.entries(toUnits).map(([unit, factor]) => {
      if (unit !== fromUnit) {
        return `${unit}: ${(inKg / factor).toFixed(4)}`;
      }
    }).filter(Boolean);
    resultDiv.innerText = results.join(', ');
  }

  // Площадь
  function convertArea() {
    const value = parseFloat(document.getElementById('areaInput').value);
    const fromUnit = document.getElementById('areaFrom').value;
    const toUnits = {
      sq_m: 1,
      sq_km: 1e6,
      hectare: 1e4,
      sq_mile: 2.59e6,
      sq_yard: 0.836127
    };

    const resultDiv = document.getElementById('areaResult');

    if (isNaN(value)) {
      resultDiv.innerText = 'Пожалуйста, введите число.';
      return;
    }

    const inSqM = value * toUnits[fromUnit];
    let results = Object.entries(toUnits).map(([unit, factor]) => {
      if (unit !== fromUnit) {
        return `${unit}: ${(inSqM / factor).toFixed(4)}`;
      }
    }).filter(Boolean);
    resultDiv.innerText = results.join(', ');
  }

  // Время
  function convertTime() {
    const value = parseFloat(document.getElementById('timeInput').value);
    const fromUnit = document.getElementById('timeFrom').value;
    const toUnits = {
      sec: 1,
      min: 60,
      hour: 3600,
      day: 86400,
      year: 31536000
    };

    const resultDiv = document.getElementById('timeResult');

    if (isNaN(value)) {
      resultDiv.innerText = 'Пожалуйста, введите число.';
      return;
    }

    const inSeconds = value * toUnits[fromUnit];
    let results = Object.entries(toUnits).map(([unit, factor]) => {
      if (unit !== fromUnit) {
        return `${unit}: ${(inSeconds / factor).toFixed(4)}`;
      }
    }).filter(Boolean);
    resultDiv.innerText = results.join(', ');
  }

  // Объем
  function convertVolume() {
    const value = parseFloat(document.getElementById('volumeInput').value);
    const fromUnit = document.getElementById('volumeFrom').value;
    const toUnits = {
      l: 1,
      ml: 0.001,
      m3: 1000,
      gal: 3.78541,
      cup: 0.236588
    };

    const resultDiv = document.getElementById('volumeResult');

    if (isNaN(value)) {
      resultDiv.innerText = 'Пожалуйста, введите число.';
      return;
    }

    const inLiters = value * toUnits[fromUnit];
    let results = Object.entries(toUnits).map(([unit, factor]) => {
      if (unit !== fromUnit) {
        return `${unit}: ${(inLiters / factor).toFixed(4)}`;
      }
    }).filter(Boolean);
    resultDiv.innerText = results.join(', ');
  }

  // Скорость
  function convertSpeed() {
    const value = parseFloat(document.getElementById('speedInput').value);
    const fromUnit = document.getElementById('speedFrom').value;
    const toUnits = {
      mps: 1,
      kmph: 1000/3600,
      mph: 0.44704,
      knot: 0.514444
    };

    const resultDiv = document.getElementById('speedResult');

    if (isNaN(value)) {
      resultDiv.innerText = 'Пожалуйста, введите число.';
      return;
    }

    const inMps = value * toUnits[fromUnit];
    let results = Object.entries(toUnits).map(([unit, factor]) => {
      if (unit !== fromUnit) {
        return `${unit}: ${(inMps / factor).toFixed(4)}`;
      }
    }).filter(Boolean);
    resultDiv.innerText = results.join(', ');
  }

</script>
</body>
</html>
