<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Эмулятор iPhone</title>
<style>
  body {
    margin: 0;
    background: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .iphone {
    position: relative;
    width: 300px;
    height: 600px;
    border: 20px solid #222;
    border-radius: 40px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    background-color: #000;
    display: flex;
    flex-direction: column;
  }

  /* Верхняя полоса - динамик */
  .notch {
    height: 40px;
    background: #222;
    border-radius: 0 0 10px 10px;
    margin-top: 10px;
    margin-bottom: 10px;
  }

  /* Экран */
  .screen {
    flex: 1;
    background-color: #fff;
    margin: 10px;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    font-size: 24px;
    color: #333;
  }

  /* Кнопка дома */
  .home-button {
    width: 60px;
    height: 60px;
    background: #222;
    border-radius: 50%;
    margin: 20px auto;
    cursor: pointer;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.3);
    transition: background 0.3s;
  }
  .home-button:hover {
    background: #555;
  }
</style>
</head>
<body>
<div class="iphone">
  <div class="notch"></div>
  <div class="screen" id="screen">Главный экран</div>
  <div class="home-button" id="homeBtn" title="Домой"></div>
</div>

<script>
const screen = document.getElementById('screen');
const homeBtn = document.getElementById('homeBtn');

homeBtn.addEventListener('click', () => {
  // Меняем содержимое экрана при нажатии
  screen.innerHTML = 'Домашний экран';
});
</script>
</body>
</html>
