<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Калькулятор</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #ffe5b4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .calculator {
    background-color: #ff6347; /* оранжево-красный фон */
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    width: 300px;
  }

  .display {
    background-color: #ff7f50; /* ярко-оранжевый дисплей */
    padding: 10px;
    font-size: 24px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: right;
    color: #fff;
    min-height: 40px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #ff8c00; /* темно-оранжевый */
    color: #fff;
    transition: background-color 0.2s;
  }

  button:hover {
    background-color: #ff7000;
  }

  .operator {
    background-color: #dc143c; /* красный для операторов */
  }

  .operator:hover {
    background-color: #b22222;
  }

  .clear {
    background-color: #a0522d; /* коричнево-красный для С */
  }

  .clear:hover {
    background-color: #8b4513;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="setOperation('+')">+</button>
    
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="operator" onclick="setOperation('-')">-</button>
    
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="operator" onclick="setOperation('*')">&times;</button>
    
    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button onclick="calculate()" style="grid-column: span 2;">=</button>
    <button class="operator" onclick="setOperation('/')">/</button>
  </div>
</div>

<script>
  let currentInput = '0';
  let previousInput = '';
  let operation = null;

  const display = document.getElementById('display');

  function updateDisplay() {
    display.innerText = currentInput;
  }

  function appendNumber(number) {
    if (currentInput === '0' && number !== '.') {
      currentInput = number;
    } else {
      currentInput += number;
    }
    updateDisplay();
  }

  function setOperation(op) {
    if (operation !== null) {
      calculate();
    }
    previousInput = currentInput;
    currentInput = '0';
    operation = op;
  }

  function calculate() {
    let prev = parseFloat(previousInput);
    let current = parseFloat(currentInput);
    if (isNaN(prev) || isNaN(current)) return;

    let result;
    switch (operation) {
      case '+':
        result = prev + current;
        break;
      case '-':
        result = prev - current;
        break;
      case '*':
        result = prev * current;
        break;
      case '/':
        result = current === 0 ? 'Ошибка' : prev / current;
        break;
      default:
        return;
    }
    currentInput = result.toString();
    operation = null;
    updateDisplay();
  }

  function clearDisplay() {
    currentInput = '0';
    previousInput = '';
    operation = null;
    updateDisplay();
  }

  updateDisplay();
</script>

</body>
</html>
