<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Генерация изображений без API ключа</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    margin-bottom: 20px;
  }
  input[type="text"] {
    width: 80%;
    padding: 10px;
    font-size: 16px;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
  #result {
    margin-top: 20px;
    max-width: 100%;
  }
  #result img {
    max-width: 100%;
    border: 2px solid #555;
  }
</style>
</head>
<body>

<h1>Генерация изображений по описанию</h1>
<input type="text" id="prompt" placeholder="Опишите изображение..." />
<button onclick="generateImage()">Генерировать</button>

<div id="result"></div>

<script>
async function generateImage() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) {
    alert('Пожалуйста, введите описание.');
    return;
  }
  
  document.getElementById('result').innerHTML = 'Генерация...';

  // Предполагается, что у вас есть локальный сервер, например, на порту 7860, который принимает POST-запросы
  // к API Stable Diffusion WebUI или другому подобному серверу.
  // Обычно API выглядит так:
  // POST http://localhost:7860/sdapi/v1/txt2img
  // с телом JSON: { "prompt": "ваше описание", "steps": 50 }

  const response = await fetch('http://localhost:7860/sdapi/v1/txt2img', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      prompt: prompt,
      steps: 50
    })
  });

  if (!response.ok) {
    document.getElementById('result').innerHTML = 'Ошибка при генерации.';
    return;
  }

  const data = await response.json();

  // Обычно результат содержит массив изображений в формате base64
  if (data.images && data.images.length > 0) {
    const imgSrc = 'data:image/png;base64,' + data.images[0];
    document.getElementById('result').innerHTML = `<img src="${imgSrc}" alt="Generated Image" />`;
  } else {
    document.getElementById('result').innerHTML = 'Изображение не получено.';
  }
}
</script>

</body>
</html>
