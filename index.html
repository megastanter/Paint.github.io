<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Кроссворды WoW</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Кроссворды WoW</h1>
</header>
<main>
  <section id="level-selection">
    <h2>Выберите уровень</h2>
    <div id="levels-container"></div>
  </section>
  <section id="crossword-section" style="display:none;">
    <button id="back-to-levels">Вернуться к уровням</button>
    <h2>Уровень <span id="current-level"></span></h2>
    <div id="crossword-clues"></div>
    <div id="crossword-container"></div>
    <button id="next-level" style="margin-top:20px; display:none;">Следующий уровень</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
