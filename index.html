<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Генератор картинок без API ключа</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    margin-bottom: 20px;
  }
  input[type="text"] {
    width: 80%;
    padding: 10px;
    font-size: 16px;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
  #images {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  img {
    max-width: 200px;
    border: 2px solid #555;
  }
</style>
</head>
<body>

<h1>Генератор картинок без API ключа</h1>
<input type="text" id="prompt" placeholder="Опишите изображение..." />
<button onclick="generateImages()">Создать картинки</button>

<div id="images"></div>

<script>
async function generateImages() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) {
    alert('Пожалуйста, введите описание.');
    return;
  }
  document.getElementById('images').innerHTML = 'Генерация...';

  // Craiyon не имеет официального API, но есть обходные пути или можно открыть их сайт.
  // Для простоты, используем их сайт через iframe или автоматический клик.

  // Для демонстрации — вставим ссылку на результаты после генерации
  // В реальности потребуется отправить запрос к их API или автоматизировать браузер.

  // Но для простоты, покажу пример с генерацией через их сайт:
  // Открываем новую вкладку с их сайтом с предзаполненным запросом (неофициально)

  const url = `https://www.craiyon.com/?q=${encodeURIComponent(prompt)}`;
  // либо можно просто показать ссылку
  document.getElementById('images').innerHTML = `<a href="${url}" target="_blank">Перейти к генерации на Craiyon</a>`;
}
</script>

</body>
</html>
