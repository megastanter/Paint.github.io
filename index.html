<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Расширенное рисование с линиями во время ведения для всех инструментов</title>
<!-- Иконки для кнопок -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
  /* Общие стили */
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #f0f2f5;
    overflow: hidden;
  }

  header {
    background-color: #2c3e50;
    color: #ecf0f1;
    display: flex;
    padding: 10px 15px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  /* Панель инструментов */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  /* Кнопки с иконками */
  .btn {
    background: #34495e;
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    color: #ecf0f1;
    font-size: 1em;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover {
    background: #3b5998;
    transform: scale(1.05);
  }

  /* Основная часть */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Боковая панель */
  #sidePanel {
    width: 240px;
    background: #fff;
    border-right: 1px solid #ccc;
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
  }

  /* Инструменты и настройки */
  #tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Цвета */
  #colorPalette {
    display: grid;
    grid-template-columns: repeat(8, 20px);
    gap: 4px;
    margin-top: 8px;
  }
  .color-swatch {
    width: 20px;
    height: 20px;
    cursor: pointer;
    border: 2px solid #ccc;
    border-radius: 3px;
    transition: border-color 0.2s;
  }
  .color-swatch.active {
    border-color: #000;
  }

  /* Расширенный выбор цвета */
  #extendedColorPicker {
    display: flex;
    flex-direction: column;
    margin-top: 10px;
  }
  #hexInput {
    width: 100%;
    padding: 4px;
    font-family: monospace;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 3px;
    margin-top: 4px;
  }

  /* Холст контейнер */
  #canvasContainer {
    flex: 1;
    position: relative;
    background: #fff;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Слои */
  #layers {
    margin-top: 20px;
  }
  #layers h4 {
    margin: 0 0 8px 0;
  }
  #layerList {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #layerList li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    background: #ecf0f1;
    margin-bottom: 4px;
    border-radius: 3px;
    cursor: pointer;
  }
  #layerList li.active {
    background: #bdc3c7;
  }
  #layerList button {
    background: transparent;
    border: none;
    cursor: pointer;
    color: #e74c3c;
    font-size: 1.2em;
  }
</style>
</head>
<body>

<header>
  <div id="toolbar">
    <button class="btn" id="undoBtn" title="Отменить (Ctrl+Z)"><i class="fas fa-undo"></i></button>
    <button class="btn" id="redoBtn" title="Повторить (Ctrl+Y)"><i class="fas fa-redo"></i></button>
    <button class="btn" id="saveBtn" title="Сохранить"><i class="fas fa-save"></i></button>
    <button class="btn" id="importBtn" title="Импортировать"><i class="fas fa-file-upload"></i></button>
    <button class="btn" id="exportBtn" title="Экспортировать"><i class="fas fa-file-download"></i></button>
    <button class="btn" id="addLayerBtn" title="Добавить слой"><i class="fas fa-layer-group"></i></button>
    <button class="btn" id="deleteLayerBtn" title="Удалить слой"><i class="fas fa-trash"></i></button>
    <button class="btn" id="toggleLayersBtn" title="Показать/скрыть слои"><i class="fas fa-eye"></i></button>
  </div>
</header>

<div class="main">
  <div id="sidePanel">
    <h4>Инструменты</h4>
    <div id="tools">
      <button class="btn" data-tool="select" title="Выделение"><i class="fas fa-mouse-pointer"></i></button>
      <button class="btn" data-tool="pen" title="Карандаш"><i class="fas fa-pen"></i></button>
      <button class="btn" data-tool="brush" title="Кисть"><i class="fas fa-brush"></i></button>
      <button class="btn" data-tool="rect" title="Прямоугольник"><i class="fas fa-square"></i></button>
      <button class="btn" data-tool="circle" title="Круг"><i class="fas fa-circle"></i></button>
      <button class="btn" data-tool="line" title="Линия"><i class="fas fa-slash"></i></button>
      <button class="btn" data-tool="arrow" title="Стрелка"><i class="fas fa-arrow-right"></i></button>
      <button class="btn" data-tool="eraser" title="Ластик"><i class="fas fa-eraser"></i></button>
      <button class="btn" data-tool="text" title="Текст"><i class="fas fa-font"></i></button>
    </div>
    <div style="margin-top:10px;">
      <label>Размер кисти</label>
      <input type="range" id="brushSize" min="1" max="50" value="5"/>
    </div>
    <div style="margin-top:10px;">
      <label>Цвет</label>
      <input type="color" id="colorPicker" title="Выберите цвет" style="margin-top:4px; width:100%; height:30px; border:none; cursor:pointer;"/>
      <div id="extendedColorPicker">
        <label for="hexInput">Введите HEX цвет:</label>
        <input type="text" id="hexInput" maxlength="7" placeholder="#RRGGBB" />
      </div>
      <div style="margin-top:8px;">
        <div style="width:30px; height:30px; border:1px solid #333; background:#000;" id="currentColorPreview"></div>
      </div>
    </div>
    <div style="margin-top:10px;">
      <button class="btn" id="gradientBtn" title="Градиент"><i class="fas fa-gradient"></i> Градиент</button>
      <button class="btn" id="blurBtn" title="Размытие"><i class="fas fa-blur"></i></button>
      <button class="btn" id="rotateBtn" title="Повернуть"><i class="fas fa-undo"></i></button>
      <button class="btn" id="scaleBtn" title="Масштабировать"><i class="fas fa-compress"></i></button>
    </div>
    <div style="margin-top:20px;">
      <h4>Слои</h4>
      <ul id="layerList"></ul>
    </div>
  </div>
  <div id="canvasContainer">
    <canvas id="canvas"></canvas>
  </div>
</div>

<!-- Модальное окно для импорта -->
<div id="modalOverlay">
  <div id="modal">
    <h4>Импортировать изображение</h4>
    <input type="file" id="fileInput"/>
    <button class="btn" id="closeModal">Закрыть</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let currentTool = 'pen';
  let currentColor = '#000000';
  let brushSize = 5;

  const colorPicker = document.getElementById('colorPicker');
  const hexInput = document.getElementById('hexInput');

  // Обновляем текущий цвет при выборе через системный пикер
  colorPicker.addEventListener('input', () => {
    currentColor = colorPicker.value;
    document.getElementById('currentColorPreview').style.backgroundColor = currentColor;
    hexInput.value = currentColor;
  });

  // Обновляем цвет при вводе HEX
  hexInput.addEventListener('input', () => {
    const val = hexInput.value;
    if(/^#([0-9A-Fa-f]{6})$/.test(val)){
      currentColor = val;
      colorPicker.value=val;
      document.getElementById('currentColorPreview').style.backgroundColor=val;
    }
  });

  // Изначально задаем текущий цвет
  document.getElementById('currentColorPreview').style.backgroundColor = currentColor;
  hexInput.value=currentColor;

  let isDrawing = false;
  let startX, startY;

  // Временный холст для отображения линий/фигур
  let tempCanvas = document.createElement('canvas');
  let tempCtx = tempCanvas.getContext('2d');

  // Слои
  const layers = [];
  let currentLayerIndex = 0;

  function createLayer(name='Layer') {
    const layer = {
      name: name,
      canvas: document.createElement('canvas'),
      visible: true
    };
    layer.canvas.width = canvas.width;
    layer.canvas.height = canvas.height;
    layer.ctx = layer.canvas.getContext('2d');
    layers.push(layer);
    currentLayerIndex=layers.length-1;
    updateLayerList();
  }

  function updateLayerList() {
    const list = document.getElementById('layerList');
    list.innerHTML='';
    layers.forEach((layer,idx)=>{
      const li=document.createElement('li');
      li.textContent=layer.name;
      if (idx===currentLayerIndex) li.classList.add('active');
      li.onclick= ()=> {
        currentLayerIndex=idx;
        updateLayerSelection();
        redraw();
      };
      const btn=document.createElement('button');
      btn.innerHTML='<i class="fas fa-trash"></i>';
      btn.title='Удалить слой';
      btn.onclick= (e) => {
        e.stopPropagation();
        layers.splice(idx,1);
        if (currentLayerIndex>=layers.length) currentLayerIndex=layers.length-1;
        updateLayerList();
        redraw();
      };
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  function updateLayerSelection() {
    document.querySelectorAll('#layerList li').forEach((li,idx)=>{
      li.classList.toggle('active', idx===currentLayerIndex);
    });
  }

  // Изначально создаем слой
  createLayer();

  // Размер холста
  function resizeCanvas() {
    const rect = document.getElementById('canvasContainer').getBoundingClientRect();
    canvas.width=rect.width;
    canvas.height=rect.height;
    layers.forEach(l => {
      l.canvas.width=canvas.width;
      l.canvas.height=canvas.height;
    });
    redraw();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Инструменты
  document.querySelectorAll('#tools button').forEach(btn => {
    btn.onclick= ()=> {
      currentTool=btn.dataset.tool;
    };
  });

  document.getElementById('brushSize').oninput=function() {
    brushSize=parseInt(this.value);
  };

  // Обработка рисования
  canvas.addEventListener('mousedown', e => {
    isDrawing=true;
    startX=e.offsetX; startY=e.offsetY;

    if (layers.length===0) createLayer();

    const currentLayer=layers[currentLayerIndex];
    currentLayer.ctx.strokeStyle= currentTool==='eraser'?'#fff':currentColor;
    currentLayer.ctx.lineWidth=brushSize;
    currentLayer.ctx.lineCap='round';

    // Для фигур создаем временный холст
    tempCanvas.width=canvas.width;
    tempCanvas.height=canvas.height;
    tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);

    // В зависимости от инструмента
    if(['pen','brush','eraser'].includes(currentTool)){
      currentLayer.ctx.beginPath();
      currentLayer.ctx.moveTo(startX,startY);
    }
  });

  canvas.addEventListener('mouseup', e => {
    if (!isDrawing) return;
    isDrawing=false;
    const currentLayer=layers[currentLayerIndex];

    // В зависимости от инструмента
    if(currentTool==='rect'){
      currentLayer.ctx.strokeStyle=currentColor;
      currentLayer.ctx.lineWidth=brushSize;
      currentLayer.ctx.strokeRect(startX,startY,e.offsetX-startX,e.offsetY-startY);
    } else if(currentTool==='circle'){
      currentLayer.ctx.strokeStyle=currentColor;
      currentLayer.ctx.lineWidth=brushSize;
      const radius=Math.hypot(e.offsetX-startX,e.offsetY-startY);
      currentLayer.ctx.beginPath();
      currentLayer.ctx.arc(startX,startY,radius,0,Math.PI*2);
      currentLayer.ctx.stroke();
    } else if(currentTool==='line'){
      currentLayer.ctx.strokeStyle=currentColor;
      currentLayer.ctx.lineWidth=brushSize;
      currentLayer.ctx.beginPath();
      currentLayer.ctx.moveTo(startX,startY);
      currentLayer.ctx.lineTo(e.offsetX,e.offsetY);
      currentLayer.ctx.stroke();
    } else if(currentTool==='arrow'){
      currentLayer.ctx.strokeStyle=currentColor;
      currentLayer.ctx.lineWidth=brushSize;
      currentLayer.ctx.beginPath();
      currentLayer.ctx.moveTo(startX,startY);
      currentLayer.ctx.lineTo(e.offsetX,e.offsetY);
      currentLayer.ctx.stroke();
      drawArrow(startX,startY,e.offsetX,e.offsetY);
    }
    redraw();
  });

  // В процессе ведения — показываем линию или фигуру
  canvas.addEventListener('mousemove', e => {
    if (!isDrawing) return;
    const currentLayer=layers[currentLayerIndex];

    // Очищаем временный холст
    tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);

    if(['pen','brush','eraser'].includes(currentTool)){
      // Рисуем линию для свободного рисования
      tempCtx.strokeStyle= currentTool==='eraser'?'#fff':currentColor;
      tempCtx.lineWidth=brushSize;
      tempCtx.lineCap='round';
      tempCtx.beginPath();
      // Линия от предыдущей точки
      // Для этого сохраняем предыдущие координаты
      // Но проще — рисовать линию от startX,startY до текущего
      // Обновляем startX/startY при каждом движении
      // Для этого сделаем так: добавим переменную lastX,lastY
      // Но для простоты - рисуем линию от начальной точки
      // или — обновляем startX/startY при каждом движении
    } else if(['rect','circle','line','arrow'].includes(currentTool)){
      // Для фигуры рисуем текущую фигуру на временном холсте
      switch(currentTool){
        case 'rect':
          tempCtx.strokeStyle=currentColor;
          tempCtx.lineWidth=brushSize;
          tempCtx.strokeRect(startX,startY,e.offsetX-startX,e.offsetY-startY);
          break;
        case 'circle':
          const radius=Math.hypot(e.offsetX-startX,e.offsetY-startY);
          tempCtx.strokeStyle=currentColor;
          tempCtx.lineWidth=brushSize;
          tempCtx.beginPath();
          tempCtx.arc(startX,startY,radius,0,Math.PI*2);
          tempCtx.stroke();
          break;
        case 'line':
          tempCtx.strokeStyle=currentColor;
          tempCtx.lineWidth=brushSize;
          tempCtx.beginPath();
          tempCtx.moveTo(startX,startY);
          tempCtx.lineTo(e.offsetX,e.offsetY);
          tempCtx.stroke();
          break;
        case 'arrow':
          tempCtx.strokeStyle=currentColor;
          tempCtx.lineWidth=brushSize;
          tempCtx.beginPath();
          tempCtx.moveTo(startX,startY);
          tempCtx.lineTo(e.offsetX,e.offsetY);
          tempCtx.stroke();
        break;
      }
    }

    // На основном холсте отображаем текущую фигуру
    redraw();
    ctx.drawImage(tempCanvas, 0, 0);
  });

  function drawArrow(fromX, fromY, toX, toY) {
    const headlen=10;
    const angle=Math.atan2(toY - fromY, toX - fromX);
    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - headlen*Math.cos(angle - Math.PI/6), toY - headlen*Math.sin(angle - Math.PI/6));
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - headlen*Math.cos(angle + Math.PI/6), toY - headlen*Math.sin(angle + Math.PI/6));
    ctx.stroke();
  }

  // Перерисовка всех слоёв
  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    layers.forEach(layer => {
      if(layer.visible){
        ctx.drawImage(layer.canvas,0,0);
      }
    });
  }

  // Создание нового слоя
  document.getElementById('addLayerBtn').onclick=()=>{
    createLayer('Layer '+(layers.length+1));
  };

  // Удаление слоя
  document.getElementById('deleteLayerBtn').onclick=()=>{
    if(layers.length>1){
      layers.splice(currentLayerIndex,1);
      if(currentLayerIndex>=layers.length) currentLayerIndex=layers.length-1;
      updateLayerList();
      redraw();
    }
  };

  // Переключение слоя вверх/вниз
  document.getElementById('moveLayerUp').onclick=()=>{
    if(currentLayerIndex<layers.length-1){
      [layers[currentLayerIndex],layers[currentLayerIndex+1]] = [layers[currentLayerIndex+1],layers[currentLayerIndex]];
      currentLayerIndex++;
      updateLayerList();
      redraw();
    }
  };
  document.getElementById('moveLayerDown').onclick=()=>{
    if(currentLayerIndex>0){
      [layers[currentLayerIndex],layers[currentLayerIndex-1]] = [layers[currentLayerIndex-1],layers[currentLayerIndex]];
      currentLayerIndex--;
      updateLayerList();
      redraw();
    }
  };

  // Эффекты
  document.getElementById('gradientBtn').onclick=()=>{
    const gradient = ctx.createLinearGradient(0,0,canvas.width,0);
    gradient.addColorStop(0,'#ff0000');
    gradient.addColorStop(0.5,'#00ff00');
    gradient.addColorStop(1,'#0000ff');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  };
  document.getElementById('blurBtn').onclick=()=>{
    ctx.filter='blur(4px)';
    redraw();
    ctx.filter='none';
  };
  document.getElementById('rotateBtn').onclick=()=>{
    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.rotate(Math.PI/12);
    ctx.translate(-canvas.width/2,-canvas.height/2);
    redraw();
    ctx.restore();
  };
  document.getElementById('scaleBtn').onclick=()=>{
    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.scale(1.2,1.2);
    ctx.translate(-canvas.width/2,-canvas.height/2);
    redraw();
    ctx.restore();
  };

  // Импорт/экспорт
  document.getElementById('saveBtn').onclick=()=>{
    const dataURL=canvas.toDataURL('image/png');
    const a=document.createElement('a');
    a.href=dataURL;
    a.download='drawing.png';
    a.click();
  };
  document.getElementById('importBtn').onclick=()=>{
    document.getElementById('fileInput').click();
  };
  document.getElementById('fileInput').onchange= e => {
    const file=e.target.files[0];
    const reader=new FileReader();
    reader.onload= ()=> {
      const img=new Image();
      img.onload= ()=> {
        ctx.drawImage(img,0,0);
        redraw();
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  };

  // Включение/выключение слоя
  let layersVisible=true;
  document.getElementById('toggleLayersBtn').onclick=()=>{
    layersVisible=!layersVisible;
    redraw();
  };

  // Изначально создаем слой
  createLayer();
</script>
</body>
</html>
