<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>2D Гонки с Траффиком</title>
<style>
  body {
    margin: 0;
    background: #222;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #444;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 20px;
    font-family: Arial, sans-serif;
    font-size: 24px;
    color: #fff;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="score">Очки: 0</div>
<script>
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.body.appendChild(canvas);

canvas.width = 400;
canvas.height = 600;

let keys = {};
let player = {
  x: 180,
  y: 500,
  width: 40,
  height: 80,
  speed: 5,
  color: 'blue'
};

let traffic = [];
let trafficCount = 0;
let score = 0;
let gameOver = false;

window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function spawnTraffic() {
  const lanePositions = [60, 180, 300]; // три полосы
  const lane = lanePositions[Math.floor(Math.random() * lanePositions.length)];
  const car = {
    x: lane,
    y: -80,
    width: 40,
    height: 80,
    speed: 4 + Math.random() * 2,
    color: 'red'
  };
  traffic.push(car);
}

function update() {
  if (gameOver) return;

  // Управление машиной игрока
  if (keys['ArrowLeft'] && player.x > 0) {
    player.x -= player.speed;
  }
  if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
    player.x += player.speed;
  }

  // Обновляем траффик
  for (let i = 0; i < traffic.length; i++) {
    traffic[i].y += traffic[i].speed;

    // Столкновение
    if (
      traffic[i].y + traffic[i].height > player.y &&
      traffic[i].y < player.y + player.height &&
      traffic[i].x < player.x + player.width &&
      traffic[i].x + traffic[i].width > player.x
    ) {
      alert('Игра окончена! Ваши очки: ' + score);
      gameOver = true;
    }

    // Удаляем, если проехали
    if (traffic[i].y > canvas.height) {
      traffic.splice(i, 1);
      score++;
      document.getElementById('score').innerText = 'Очки: ' + score;
      i--;
    }
  }

  // Спавним новых машин через определенное время
  trafficCount++;
  if (trafficCount > 50) {
    spawnTraffic();
    trafficCount = 0;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Рисуем дорогу
  ctx.fillStyle = '#555';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Линии разметки
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 2;
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(canvas.width/2, y);
    ctx.lineTo(canvas.width/2, y + 20);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Рисуем машину игрока
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Рисуем траффик
  for (let car of traffic) {
    ctx.fillStyle = car.color;
    ctx.fillRect(car.x, car.y, car.width, car.height);
  }
}

function gameLoop() {
  update();
  draw();
  if (!gameOver) {
    requestAnimationFrame(gameLoop);
  }
}

gameLoop();

</script>
</body>
</html>
