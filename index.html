<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painter</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #toolbar {
    display: flex;
    align-items: center;
    padding: 8px;
    background-color: #fafafa;
    border-bottom: 1px solid #ccc;
  }
  #toolbar > * {
    margin-right: 10px;
  }
  #canvasContainer {
    flex: 1;
    position: relative;
  }
  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    background-color: #fff;
  }
  button {
    padding: 5px 10px;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="undoBtn">Отменить</button>
  <button id="redoBtn">Повторить</button>
  <button id="clearBtn">Очистить</button>
  <button id="saveBtn">Сохранить</button>
  <button id="loadBtn">Загрузить</button>
  <label>
    Цвет линий:
    <input type="color" id="colorPicker" value="#000000" />
  </label>
  <label>
    Толщина:
    <input type="range" id="lineWidth" min="1" max="10" value="3" />
  </label>
  <label>
    Инструмент:
    <select id="toolSelect">
      <option value="pencil">Карандаш</option>
      <option value="rectangle">Прямоугольник</option>
      <option value="circle">Круг</option>
      <option value="erase">Ластик</option>
    </select>
  </label>
</div>

<div id="canvasContainer">
  <canvas id="canvas"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let drawing = false;
let currentTool = 'pencil';
let currentColor = document.getElementById('colorPicker').value;
let lineWidth = document.getElementById('lineWidth').value;
let startX = 0;
let startY = 0;
let history = [];
let redoStack = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - document.getElementById('toolbar').offsetHeight;
  redraw();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

document.getElementById('colorPicker').addEventListener('input', (e) => {
  currentColor = e.target.value;
});
document.getElementById('lineWidth').addEventListener('input', (e) => {
  lineWidth = e.target.value;
});
document.getElementById('toolSelect').addEventListener('change', (e) => {
  currentTool = e.target.value;
});

// История для undo/redo
function saveState() {
  history.push(canvas.toDataURL());
  if (history.length > 50) {
    history.shift();
  }
}
function restoreState() {
  if (history.length > 0) {
    const imgData = history.pop();
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = imgData;
  }
}

document.getElementById('undoBtn').addEventListener('click', () => {
  if (history.length > 0) {
    redoStack.push(canvas.toDataURL());
    restoreState();
  }
});
document.getElementById('redoBtn').addEventListener('click', () => {
  if (redoStack.length > 0) {
    saveState();
    const imgData = redoStack.pop();
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = imgData;
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  saveState();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const dataUrl = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'drawing.png';
  a.click();
});

document.getElementById('loadBtn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = () => {
        saveState();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
});

// Основные события рисования
canvas.addEventListener('mousedown', (e) => {
  saveState();
  drawing = true;
  startX = e.clientX;
  startY = e.clientY;
  if (currentTool === 'pencil' || currentTool === 'erase') {
    ctx.strokeStyle = currentTool === 'erase' ? '#FFFFFF' : currentColor;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
});
canvas.addEventListener('mouseup', (e) => {
  drawing = false;
  if (currentTool !== 'pencil' && currentTool !== 'erase') {
    drawShape(e.clientX, e.clientY);
  }
});
canvas.addEventListener('mousemove', (e) => {
  if (!drawing) return;
  if (currentTool === 'pencil' || currentTool === 'erase') {
    ctx.strokeStyle = currentTool === 'erase' ? '#FFFFFF' : currentColor;
    ctx.lineWidth = lineWidth;
    ctx.lineTo(e.clientX, e.clientY);
    ctx.stroke();
  } else {
    // В режиме рисования фигуры, показывать временную фигуру (можно реализовать)
    // для упрощения - не делаем сейчас
  }
});

// Функция для рисования фигур
function drawShape(endX, endY) {
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = lineWidth;
  const rectX = Math.min(startX, endX);
  const rectY = Math.min(startY, endY);
  const rectW = Math.abs(endX - startX);
  const rectH = Math.abs(endY - startY);
  if (currentTool === 'rectangle') {
    ctx.strokeRect(rectX, rectY, rectW, rectH);
  } else if (currentTool === 'circle') {
    ctx.beginPath();
    const radius = Math.sqrt((endX - startX) ** 2 + (endY - startY) ** 2);
    ctx.arc(startX, startY, radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// Для более точного рисования фигур можно добавить предварительный отображение

</script>

</body>
</html>
