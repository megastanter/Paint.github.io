<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Рабочий пример 3D с физикой мягких тел и WebGL</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>

<!-- Загрузка Three.js и Ammo.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ammo.js/builds/ammo.wasm.js"></script>

<script>
let scene, camera, renderer;
let physicsWorld;
let rigidBodies = [];
let softBodies = [];
let tmpTransform;

init();

async function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.2, 2000);
  camera.position.set(0, 20, 50);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  await Ammo(); // Ждем инициализацию Ammo.js

  setupPhysics();
  createScene();

  window.addEventListener('resize', onWindowResize);
  animate();
}

function setupPhysics() {
  const collisionConfiguration = new Ammo.btSoftBodyRigidBodyCollisionConfiguration();
  const dispatcher = new Ammo.btCollisionDispatcher(collisionConfiguration);
  const broadphase = new Ammo.btDbvtBroadphase();
  const solver = new Ammo.btSequentialImpulseConstraintSolver();
  const softBodySolver = new Ammo.btDefaultSoftBodySolver();

  physicsWorld = new Ammo.btSoftRigidDynamicsWorld(
    dispatcher, broadphase, solver, collisionConfiguration, softBodySolver
  );
  physicsWorld.setGravity(new Ammo.btVector3(0, -9.82, 0));
  physicsWorld.getWorldInfo().set_m_gravity(new Ammo.btVector3(0, -9.82, 0));
  tmpTransform = new Ammo.btTransform();
}

function createScene() {
  // Создаем землю
  const groundSize = 100;
  const groundGeo = new THREE.BoxGeometry(groundSize, 1, groundSize);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
  const groundMesh = new THREE.Mesh(groundGeo, groundMat);
  groundMesh.position.y = -0.5;
  scene.add(groundMesh);

  const groundShape = new Ammo.btBoxShape(new Ammo.btVector3(groundSize/2, 0.5, groundSize/2));
  const groundBody = new Ammo.btRigidBody(
    new Ammo.btRigidBodyConstructionInfo(0, new Ammo.btDefaultMotionState(), groundShape, new Ammo.btVector3(0,0,0))
  );
  physicsWorld.addRigidBody(groundBody);

  // Создаем жесткий куб
  createRigidBox(0, 2, 0, 2, 2, 2, 0xff0000);

  // Создаем мягкое тело: сетку из мягких элементов
  createSoftBodyBox(0, 8, 0, 4, 4, 4);
}

// Создание жесткого блока
function createRigidBox(x, y, z, sx, sy, sz, colorHex) {
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  const mat = new THREE.MeshStandardMaterial({ color: colorHex });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);

  const shape = new Ammo.btBoxShape(new Ammo.btVector3(sx/2, sy/2, sz/2));
  const mass = 10;
  const localInertia = new Ammo.btVector3(0,0,0);
  shape.calculateLocalInertia(mass, localInertia);
  const ms = new Ammo.btDefaultMotionState(new Ammo.btTransform(
    new Ammo.btQuaternion(0,0,0,1),
    new Ammo.btVector3(x,y,z)
  ));
  const rbInfo = new Ammo.btRigidBodyConstructionInfo(mass, ms, shape, localInertia);
  const body = new Ammo.btRigidBody(rbInfo);
  physicsWorld.addRigidBody(body);
  mesh.userData.physicsBody = body;
  rigidBodies.push(mesh);
}

// Создание мягкого тела (простая сетка)
function createSoftBodyBox(x, y, z, sx, sy, sz) {
  const softBodyHelpers = new Ammo.btSoftBodyHelpers();
  const numSegments = 4; // более мелкая сетка — более точная деформация

  const vertices = [];
  for (let i = 0; i <= numSegments; i++) {
    for (let j = 0; j <= numSegments; j++) {
      for (let k = 0; k <= numSegments; k++) {
        vertices.push(new Ammo.btVector3(
          (i / numSegments - 0.5) * sx,
          (j / numSegments) * sy + y,
          (k / numSegments - 0.5) * sz
        ));
      }
    }
  }

  // Для простоты создадим мягкое тело из точек без треугольников (можно усложнить)
  const shapePoints = vertices.flatMap(v => [v.x(), v.y(), v.z()]);

  const softBody = softBodyHelpers.CreateFromTriMesh(
    physicsWorld.getWorldInfo(),
    shapePoints,
    [], // треугольники — сложнее реализовать, оставляем пустым для примера
    0
  );

  softBody.get_m_materials().at(0).set_m_kLST(0.9);
  softBody.setTotalMass(1, false);
  physicsWorld.addSoftBody(softBody);
  softBodies.push(softBody);

  // Визуализация мягкого тела — очень сложная задача, требует особой логики.
  // Для примера создадим простую сетку
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(vertices.length * 3);
  for (let i = 0; i < vertices.length; i++) {
    positions[3*i] = vertices[i].x();
    positions[3*i + 1] = vertices[i].y();
    positions[3*i + 2] = vertices[i].z();
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.MeshStandardMaterial({ color: 0x00ff00, wireframe: true });
  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);
  softBodies.forEach(sb => { sb.threeMesh = mesh; }); // связь для обновления
}

function onWindowResize() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  if (typeof Ammo === 'undefined') return;

  // Шаг симуляции
  physicsWorld.stepSimulation(1/60, 10);

  // Обновление жестких тел
  for (let obj of rigidBodies) {
    const objPhys = obj.userData.physicsBody;
    const ms = objPhys.getMotionState();
    if (ms) {
      ms.getWorldTransform(tmpTransform);
      const p = tmpTransform.getOrigin();
      const q = tmpTransform.getRotation();
      obj.position.set(p.x(), p.y(), p.z());
      obj.quaternion.set(q.x(), q.y(), q.z(), q.w());
    }
  }

  // Обновление мягких тел — для простоты пропущено, нужно писать отдельно

  renderer.render(scene, camera);
}
</script>

</body>
</html>
