<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Painter</title>
<style>
  body {
    margin: 0;
    font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
    background: #c0c0c0;
  }

  /* Заголовок */
  #title {
    background: #0078D7;
    color: white;
    padding: 8px 12px;
    font-size: 20px;
    font-weight: bold;
  }

  /* Панель инструментов */
  #toolbar {
    display: flex;
    background: #e0e0e0;
    padding: 4px;
    align-items: center;
  }

  /* Кнопки инструментов */
  button {
    margin: 0 4px;
    padding: 4px 8px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Цвет и размер */
  input[type=color], input[type=range] {
    margin: 0 8px;
    cursor: pointer;
  }

  /* Вкладки и меню (если будут) */
  /* Холст контейнер */
  #canvasContainer {
    position: relative;
    border: 1px solid #888;
    margin: 4px;
  }

  /* Холст */
  #paintCanvas {
    display: block;
    background: #fff;
  }
</style>
</head>
<body>

<div id="title">Painter</div>

<!-- Панель инструментов -->
<div id="toolbar">
  <button id="btnPencil" title="Кисть" style="background-image: url('https://img.icons8.com/ios/24/000000/pencil.png'); background-repeat:no-repeat; background-position: center; background-size: contain;">Кисть</button>
  <button id="btnLine" title="Линия" style="background-image: url('https://img.icons8.com/ios/24/000000/line.png'); background-repeat:no-repeat; background-position: center; background-size: contain;">Линия</button>
  <button id="btnRectangle" title="Прямоугольник" style="background-image: url('https://img.icons8.com/ios/24/000000/square.png'); background-repeat:no-repeat; background-position: center; background-size: contain;">Прямоугольник</button>
  <button id="btnEllipse" title="Эллипс" style="background-image: url('https://img.icons8.com/ios/24/000000/ellipse.png'); background-repeat:no-repeat; background-position: center; background-size: contain;">Эллипс</button>
  <button id="btnEraser" title="Ластик" style="background-image: url('https://img.icons8.com/ios/24/000000/eraser.png'); background-repeat:no-repeat; background-position: center; background-size: contain;">Ластик</button>
  <button id="btnClear" title="Очистить" style="background-image: url('https://img.icons8.com/ios/24/000000/trash.png'); background-repeat:no-repeat; background-position: center; background-size: contain;">Очистить</button>
  <label>Цвет: <input type="color" id="colorPicker" value="#000000"></label>
  <label>Толщина: <input type="range" id="sizeRange" min="1" max="30" value="3"></label>
</div>

<!-- Холст -->
<div id="canvasContainer">
  <canvas id="paintCanvas" width="1200" height="700"></canvas>
</div>

<script>
  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d');

  const colorPicker = document.getElementById('colorPicker');
  const sizeRange = document.getElementById('sizeRange');

  const btnPencil = document.getElementById('btnPencil');
  const btnLine = document.getElementById('btnLine');
  const btnRectangle = document.getElementById('btnRectangle');
  const btnEllipse = document.getElementById('btnEllipse');
  const btnEraser = document.getElementById('btnEraser');
  const btnClear = document.getElementById('btnClear');

  let currentTool = 'pencil'; // по умолчанию
  let isDrawing = false;
  let startX = 0;
  let startY = 0;
  let savedImageData = null;

  // Обработка выбора инструмента
  document.querySelectorAll('#toolbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTool = btn.id.replace('btn', '').toLowerCase();
    });
  });

  // Очистка холста
  document.getElementById('btnClear').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // Начало рисования
  canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    startX = e.offsetX;
    startY = e.offsetY;

    if (currentTool === 'pencil' || currentTool === 'eraser') {
      ctx.strokeStyle = currentTool === 'eraser' ? '#FFFFFF' : colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(startX, startY);
    } else if (currentTool === 'line' || currentTool === 'rectangle' || currentTool === 'ellipse') {
      // сохраняем изображение перед рисованием фигуры
      savedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
  });

  // В процессе рисования
  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    const x = e.offsetX;
    const y = e.offsetY;

    ctx.lineWidth = sizeRange.value;
    ctx.lineCap = 'round';

    if (currentTool === 'pencil' || currentTool === 'eraser') {
      ctx.strokeStyle = currentTool === 'eraser' ? '#FFFFFF' : colorPicker.value;
      ctx.lineTo(x, y);
      ctx.stroke();
    } else if (currentTool === 'line') {
      ctx.putImageData(savedImageData, 0, 0);
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(x, y);
      ctx.stroke();
    } else if (currentTool === 'rectangle') {
      ctx.putImageData(savedImageData, 0, 0);
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.strokeRect(startX, startY, x - startX, y - startY);
    } else if (currentTool === 'ellipse') {
      ctx.putImageData(savedImageData, 0, 0);
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.beginPath();
      const radiusX = Math.abs(x - startX) / 2;
      const radiusY = Math.abs(y - startY) / 2;
      const centerX = (startX + x) / 2;
      const centerY = (startY + y) / 2;
      ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  // Конец рисования
  canvas.addEventListener('mouseup', (e) => {
    if (!isDrawing) return;
    isDrawing = false;
    const x = e.offsetX;
    const y = e.offsetY;

    if (currentTool === 'line') {
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(x, y);
      ctx.stroke();
    } else if (currentTool === 'rectangle') {
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.strokeRect(startX, startY, x - startX, y - startY);
    } else if (currentTool === 'ellipse') {
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = sizeRange.value;
      ctx.beginPath();
      const radiusX = Math.abs(x - startX) / 2;
      const radiusY = Math.abs(y - startY) / 2;
      const centerX = (startX + x) / 2;
      const centerY = (startY + y) / 2;
      ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  // Ластик
  btnEraser.addEventListener('click', () => {
    currentTool = 'eraser';
  });

  // Инструмент кисть
  btnPencil.addEventListener('click', () => {
    currentTool = 'pencil';
  });

  // Линия
  btnLine.addEventListener('click', () => {
    currentTool = 'line';
  });

  // Прямоугольник
  btnRectangle.addEventListener('click', () => {
    currentTool = 'rectangle';
  });

  // Эллипс
  btnEllipse.addEventListener('click', () => {
    currentTool = 'ellipse';
  });
</script>
</body>
</html>
