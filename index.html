<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Песочница — Продвинутая версия</title>
<style>
  body {
    margin: 0;
    background: #222;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  #ui {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  button {
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    background: #ffb347;
    cursor: pointer;
  }
  button:hover {
    background: #ff8c42;
  }
  #fpsCounter {
    color: #fff;
    font-size: 14px;
    margin-left: 20px;
  }
  #gameCanvas {
    display: block;
  }
</style>
</head>
<body>

<div id="ui">
  <button id="addBox">Добавить блок</button>
  <button id="toggleGravity">Гравитация: Вкл/Выкл</button>
  <button id="pauseBtn">Пауза</button>
  <button id="clearBtn">Очистить</button>
  <div id="fpsCounter"></div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

window.onresize = () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
};

// Настройки
let objects = [];
let gravityEnabled = true;
let paused = false;

// Объявление классов объектов
class GameObject {
  constructor(x, y, w, h, color) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.color = color;
    this.vx = 0;
    this.vy = 0;
    this.isStatic = false; // статичный объект (например, платформа)
    this.id = Math.random().toString(36).substr(2, 9);
  }
  update() {
    if (!this.isStatic && !paused) {
      if (gravityEnabled) this.vy += 0.5; // гравитация
      this.x += this.vx;
      this.y += this.vy;

      // Столкновения с полом
      if (this.y + this.h > height) {
        this.y = height - this.h;
        this.vy = 0;
      }

      // Столкновения с боками
      if (this.x < 0) {
        this.x = 0;
        this.vx *= -0.5;
      }
      if (this.x + this.w > width) {
        this.x = width - this.w;
        this.vx *= -0.5;
      }
    }
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
  }
}

// Создание базовых объектов
function createBox(x, y, w=50, h=50, color='#ffa07a') {
  const obj = new GameObject(x, y, w, h, color);
  objects.push(obj);
}

// Обработка интерфейса
document.getElementById('addBox').onclick = () => {
  createBox(Math.random() * (width - 50), 50);
};

let gravityToggle = true;
document.getElementById('toggleGravity').onclick = () => {
  gravityEnabled = !gravityEnabled;
};

document.getElementById('pauseBtn').onclick = () => {
  paused = !paused;
};

document.getElementById('clearBtn').onclick = () => {
  objects = [];
};

// Взаимодействие с мышью
let selectedObject = null;
let offsetX = 0;
let offsetY = 0;

canvas.onmousedown = (e) => {
  for (let obj of objects) {
    if (
      e.offsetX >= obj.x && e.offsetX <= obj.x + obj.w &&
      e.offsetY >= obj.y && e.offsetY <= obj.y + obj.h
    ) {
      selectedObject = obj;
      offsetX = e.offsetX - obj.x;
      offsetY = e.offsetY - obj.y;
      break;
    }
  }
};

canvas.onmousemove = (e) => {
  if (selectedObject) {
    selectedObject.x = e.offsetX - offsetX;
    selectedObject.y = e.offsetY - offsetY;
    selectedObject.vx = 0;
    selectedObject.vy = 0;
  }
};

canvas.onmouseup = () => {
  selectedObject = null;
};

// Основной цикл
let fpsCounter = document.getElementById('fpsCounter');
let lastTime = performance.now();
let fps = 0;

function gameLoop() {
  if (!paused) {
    ctx.clearRect(0, 0, width, height);
    for (let obj of objects) {
      obj.update();
      obj.draw();
    }
  }
  // FPS расчет
  const now = performance.now();
  fps = Math.round(1000 / (now - lastTime));
  lastTime = now;
  fpsCounter.innerText = `FPS: ${fps}`;
  requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
