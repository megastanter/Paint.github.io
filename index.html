<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Российское интернет-радио</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin-bottom: 20px;
  }
  select {
    padding: 10px;
    font-size: 16px;
    width: 80%;
    margin-bottom: 20px;
  }
  #player {
    width: 80%;
  }
</style>
</head>
<body>

<h1>Российское интернет-радио</h1>

<select id="radioSelect" onchange="playStation()">
  <option value="">Выберите радиостанцию</option>
  <option value="https://icecast.rusradio.com/rusradio.mp3">Русское Радио</option>
  <option value="https://icecast.radiozen.ru/radiozen.mp3">Radio Zen</option>
  <option value="https://listen.radiorecord.ru/radiorecord.mp3">Radio Record</option>
  <option value="https://icecast.rockfm.ru/rockfm.mp3">Rock FM</option>
  <option value="https://icecast.radio6.ru/radio6.mp3">Радио 6</option>
  <option value="https://icecast.radiomayak.ru/mayak.mp3">Маяк</option>
  <option value="https://icecast.radiostyle.ru/radiostyle.mp3">Радио Стиль</option>
  <option value="https://icecast.radiomir.ru/mir.mp3">Радио Мир</option>
  <option value="https://icecast.radio7.ru/radio7.mp3">Радио 7</option>
</select>

<audio id="player" controls autoplay></audio>

<script>
function playStation() {
  const select = document.getElementById('radioSelect');
  const audio = document.getElementById('player');
  const url = select.value;
  if (url) {
    audio.src = url;
    audio.play();
  }
}
</script>

</body>
</html>
