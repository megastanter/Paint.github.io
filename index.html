<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Paint - Аналог Windows</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
  }
  #toolbar {
    display: flex;
    padding: 10px;
    background: #eee;
    flex-wrap: wrap;
    align-items: center;
  }
  button, input[type=color], select {
    margin-right: 10px;
    margin-bottom: 5px;
  }
  #canvasContainer {
    flex: 1;
    position: relative;
  }
  canvas {
    border: 1px solid #000;
    display: block;
    width: 100%;
    height: calc(100vh - 80px);
  }
</style>
</head>
<body>

<div id="toolbar">
  <!-- Инструменты -->
  <button id="pencilBtn">Карандаш</button>
  <button id="brushBtn">Кисть</button>
  <button id="eraserBtn">Ластик</button>
  <button id="lineBtn">Линия</button>
  <button id="rectBtn">Прямоугольник</button>
  <button id="ellipseBtn">Эллипс</button>
  <button id="textBtn">Текст</button>
  <button id="fillBtn">Заливка</button>
  <button id="selectBtn">Выделение</button>
  <button id="clearBtn">Очистить</button>
  <button id="undoBtn">Отмена</button>
  <button id="redoBtn">Повтор</button>
  <button id="saveBtn">Сохранить</button>
  <input type="file" id="loadFile" accept="image/*" />
  <button id="loadBtn">Загрузить</button>
  
  <!-- Настройки -->
  <label>Цвет:
    <input type="color" id="colorPicker" value="#000000" />
  </label>
  <label>Толщина:
    <select id="lineWidth">
      <option value="1">1px</option>
      <option value="3" selected>3px</option>
      <option value="5">5px</option>
      <option value="10">10px</option>
    </select>
  </label>
</div>

<div id="canvasContainer">
  <canvas id="paintCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');

let currentTool = 'pencil'; // инструмент
let drawing = false;
let startX = 0;
let startY = 0;
let savedImage = null;
let currentColor = document.getElementById('colorPicker').value;
let lineWidth = parseInt(document.getElementById('lineWidth').value);
let undoStack = [];
let redoStack = [];
let fillColor = currentColor;
let selection = null; // для выделения
let selectionCanvas = null; // для сохранения выделенной области

// Настройки
document.getElementById('colorPicker').addEventListener('change', (e) => {
  currentColor = e.target.value;
});
document.getElementById('lineWidth').addEventListener('change', (e) => {
  lineWidth = parseInt(e.target.value);
});

// Размер холста под окно
function resizeCanvas() {
  const container = document.getElementById('canvasContainer');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  redraw();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Функция для сохранения состояния (отмена/повтор)
function saveState() {
  undoStack.push(canvas.toDataURL());
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
}

// Восстановление по истории
function restoreState(stack, otherStack) {
  if (stack.length === 0) return;
  const dataURL = stack.pop();
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  }
  img.src = dataURL;
  otherStack.push(dataURL);
}

// Инструменты
document.getElementById('pencilBtn').onclick = () => { currentTool='pencil'; };
document.getElementById('brushBtn').onclick = () => { currentTool='brush'; };
document.getElementById('eraserBtn').onclick = () => { currentTool='eraser'; };
document.getElementById('lineBtn').onclick = () => { currentTool='line'; };
document.getElementById('rectBtn').onclick = () => { currentTool='rect'; };
document.getElementById('ellipseBtn').onclick = () => { currentTool='ellipse'; };
document.getElementById('textBtn').onclick = () => { currentTool='text'; };
document.getElementById('fillBtn').onclick = () => { currentTool='fill'; };
document.getElementById('selectBtn').onclick = () => { currentTool='select'; };

// Очистка
document.getElementById('clearBtn').onclick = () => {
  saveState();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// Undo / Redo
document.getElementById('undoBtn').onclick = () => { restoreState(undoStack, redoStack); };
document.getElementById('redoBtn').onclick = () => {
  if (redoStack.length > 0) {
    const dataURL = redoStack.pop();
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    }
    img.src = dataURL;
  }
}

// Сохранение
document.getElementById('saveBtn').onclick = () => {
  const dataURL = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'paint.png';
  a.click();
}

// Загрузка изображения
document.getElementById('loadBtn').onclick = () => {
  document.getElementById('loadFile').click();
};
document.getElementById('loadFile').onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = () => {
        saveState();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      img.src = ev.target.result;
    }
    reader.readAsDataURL(file);
  }
};

// Основные обработчики
canvas.addEventListener('mousedown', (e) => {
  savingForShape = true;
  startX = e.offsetX;
  startY = e.offsetY;
  if (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser') {
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  } else if (currentTool === 'fill') {
    // Простая заливка
    saveState();
    ctx.fillStyle = currentColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else if (currentTool === 'text') {
    const text = prompt('Введите текст');
    if (text) {
      saveState();
      ctx.fillStyle = currentColor;
      ctx.font = lineWidth * 4 + 'px Arial';
      ctx.fillText(text, startX, startY);
    }
  } else if (currentTool === 'select') {
    // Выделение (простой прямоугольник)
    selection = {x1: startX, y1: startY, x2: startX, y2: startY};
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (drawing && (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser')) {
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.strokeStyle = currentTool==='eraser'?'white':currentColor;
    ctx.lineWidth = currentTool==='brush'?lineWidth*2:lineWidth;
    ctx.lineCap = 'round';
    ctx.stroke();
  } else if (savingForShape && (currentTool==='line' || currentTool==='rect' || currentTool==='ellipse')) {
    // Для примера, не рисуем тут, рисуем только по отпусканию
  } else if (currentTool==='select' && selection) {
    selection.x2 = e.offsetX;
    selection.y2 = e.offsetY;
    redraw();
  }
});

let savingForShape = false;

canvas.addEventListener('mouseup', (e) => {
  if (drawing && (currentTool==='pencil' || currentTool==='brush' || currentTool==='eraser')) {
    drawing = false;
    saveState();
  } else if (savingForShape && (currentTool==='line' || currentTool==='rect' || currentTool==='ellipse')) {
    saveState();
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    if (currentTool==='line') {
      ctx.moveTo(startX, startY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    } else if (currentTool==='rect') {
      ctx.strokeRect(startX, startY, e.offsetX - startX, e.offsetY - startY);
    } else if (currentTool==='ellipse') {
      // Окружность или эллипс
      let centerX = (startX + e.offsetX)/2;
      let centerY = (startY + e.offsetY)/2;
      let radiusX = Math.abs(e.offsetX - startX)/2;
      let radiusY = Math.abs(e.offsetY - startY)/2;
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.scale(1, radiusY/radiusX);
      ctx.beginPath();
      ctx.arc(0, 0, radiusX, 0, Math.PI * 2);
      ctx.restore();
      ctx.stroke();
    }
    savingForShape = false;
  } else if (currentTool==='select' && selection) {
    // Создаем выделение
    const x = Math.min(selection.x1, selection.x2);
    const y = Math.min(selection.y1, selection.y2);
    const w = Math.abs(selection.x2 - selection.x1);
    const h = Math.abs(selection.y2 - selection.y1);
    // Создаем временный холст для выделенной области
    selectionCanvas = document.createElement('canvas');
    selectionCanvas.width = w;
    selectionCanvas.height = h;
    const sctx = selectionCanvas.getContext('2d');
    sctx.drawImage(canvas, x, y, w, h, 0, 0, w, h);
    // Очищаем выбранную область на основном холсте
    ctx.clearRect(x, y, w, h);
    selection = null;
    redraw();
  }
});

// Двойной клик для вставки выделения
canvas.addEventListener('dblclick', () => {
  if (selectionCanvas) {
    saveState();
    ctx.drawImage(selectionCanvas, selection.x1, selection.y1);
    selectionCanvas = null;
  }
});

// Функция перерисовки (например, для рамки выделения)
function redraw() {
  // Для простоты не рисуем рамки выделения
}

// Инициализация
saveState();
</script>

</body>
</html>
