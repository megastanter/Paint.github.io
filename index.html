<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Геометрия Даш - Улучшенная версия</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ece9e6, #ffffff);
    margin: 0;
    padding: 20px;
  }
  #gameContainer {
    width: 800px;
    margin: 0 auto;
    background: #fff;
    border: 4px solid #333;
    border-radius: 10px;
    padding: 20px;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
  }
  #canvas {
    width: 100%;
    height: 500px;
    border: 2px solid #555;
    background: #fafafa;
    border-radius: 8px;
    cursor: pointer;
  }
  #levelTitle {
    text-align: center;
    font-size: 24px;
    margin-bottom: 10px;
  }
  #progress {
    margin-top: 10px;
    font-size: 18px;
    text-align: center;
  }
  #nextLevelBtn {
    display: block;
    margin: 15px auto;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
  }
  #nextLevelBtn:hover {
    background-color: #0056b3;
  }
</style>
</head>
<body>

<h1 style="text-align:center;">Геометрия Даш - Улучшенная версия</h1>
<div id="gameContainer">
  <div id="levelTitle">Уровень 1</div>
  <canvas id="canvas" width="760" height="500"></canvas>
  <div id="progress">Прогресс: 0/0</div>
  <button id="nextLevelBtn">Следующий уровень</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const levelTitle = document.getElementById('levelTitle');
const progressText = document.getElementById('progress');
const nextButton = document.getElementById('nextLevelBtn');

let currentLevelIndex = 0;

// Различные уровни с более сложными объектами и преградами
const levels = [
  {
    description: 'Нажмите на все красные кубы, избегая препятствий!',
    objects: [
      { type: 'square', x: 50, y: 50, size: 50, color: 'red', clicked: false, id: 1 },
      { type: 'square', x: 200, y: 100, size: 50, color: 'red', clicked: false, id: 2 },
      { type: 'square', x: 350, y: 50, size: 50, color: 'red', clicked: false, id: 3 },
    ],
    targetColor: 'red',
    obstacles: [
      { type: 'barrier', x: 100, y: 200, width: 200, height: 20 },
      { type: 'barrier', x: 300, y: 300, width: 250, height: 20 },
    ],
    goal: 3
  },
  {
    description: 'Кликайте на зеленых круги, избегая препятствий!',
    objects: [
      { type: 'circle', x: 100, y: 150, radius: 30, color: 'green', clicked: false, id: 4 },
      { type: 'circle', x: 250, y: 250, radius: 30, color: 'green', clicked: false, id: 5 },
      { type: 'circle', x: 400, y: 150, radius: 30, color: 'green', clicked: false, id: 6 },
    ],
    targetColor: 'green',
    obstacles: [
      { type: 'barrier', x: 150, y: 200, width: 20, height: 150 },
      { type: 'barrier', x: 350, y: 100, width: 20, height: 300 },
    ],
    goal: 3
  },
  {
    description: 'Нажимайте на синие треугольники, избегая преград!',
    objects: [
      { type: 'triangle', x: 150, y: 100, size: 50, color: 'blue', clicked: false, id: 7 },
      { type: 'triangle', x: 300, y: 200, size: 50, color: 'blue', clicked: false, id: 8 },
    ],
    targetColor: 'blue',
    obstacles: [
      { type: 'barrier', x: 200, y: 150, width: 100, height: 20 },
      { type: 'barrier', x: 250, y: 250, width: 20, height: 100 },
    ],
    goal: 2
  }
];

let currentLevel = levels[currentLevelIndex];

function drawObject(obj) {
  ctx.save();
  ctx.translate(obj.x, obj.y);
  ctx.fillStyle = obj.color;
  if (obj.type === 'square') {
    ctx.fillRect(-obj.size/2, -obj.size/2, obj.size, obj.size);
  } else if (obj.type === 'circle') {
    ctx.beginPath();
    ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
    ctx.fill();
  } else if (obj.type === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(0, -obj.size/2);
    ctx.lineTo(-obj.size/2, obj.size/2);
    ctx.lineTo(obj.size/2, obj.size/2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawBarrier(barrier) {
  ctx.fillStyle = '#555';
  ctx.fillRect(barrier.x, barrier.y, barrier.width, barrier.height);
}

function drawLevel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Рисуем препятствия
  if (currentLevel.obstacles) {
    currentLevel.obstacles.forEach(drawBarrier);
  }

  // Рисуем объекты
  currentLevel.objects.forEach(obj => {
    drawObject(obj);
  });

  updateProgress();
}

function updateProgress() {
  const clickedCount = currentLevel.objects.filter(o => o.clicked).length;
  progressText.innerText = `Прогресс: ${clickedCount}/${currentLevel.goal}`;
}

function checkCollision(x, y) {
  // Проверка на препятствия
  for (const barrier of currentLevel.obstacles) {
    if (
      x >= barrier.x && x <= barrier.x + barrier.width &&
      y >= barrier.y && y <= barrier.y + barrier.height
    ) {
      return true; // столкновение с преградой
    }
  }
  return false;
}

function handleClick(x, y) {
  const level = currentLevel;
  let levelComplete = false;

  for (let obj of level.objects) {
    if (!obj.clicked) {
      if (obj.type === 'square') {
        if (
          x >= obj.x - obj.size/2 && x <= obj.x + obj.size/2 &&
          y >= obj.y - obj.size/2 && y <= obj.y + obj.size/2
        ) {
          // Проверка на столкновение с препятствием
          if (checkCollision(x, y)) {
            alert('Столкновение с препятствием!');
            return;
          }
          if (obj.color === level.targetColor) {
            obj.clicked = true;
            updateProgress();
            // Проверка завершения уровня
            if (currentLevel.objects.filter(o => o.clicked).length >= currentLevel.goal) {
              alert('Вы прошли уровень!');
              levelComplete = true;
            }
            break;
          } else {
            alert('Неверный объект!');
            return;
          }
        }
      } else if (obj.type === 'circle') {
        const dx = x - obj.x;
        const dy = y - obj.y;
        if (dx * dx + dy * dy <= obj.radius * obj.radius) {
          // Столкновение с препятствием
          if (checkCollision(x, y)) {
            alert('Столкновение с препятствием!');
            return;
          }
          if (obj.color === level.targetColor) {
            obj.clicked = true;
            updateProgress();
            if (currentLevel.objects.filter(o => o.clicked).length >= currentLevel.goal) {
              alert('Вы прошли уровень!');
              levelComplete = true;
            }
            break;
          } else {
            alert('Неверный объект!');
            return;
          }
        }
      } else if (obj.type === 'triangle') {
        // Проверка попадания по треугольнику (примерно)
        // Для простоты используем bounding box
        const minX = obj.x - obj.size/2;
        const maxX = obj.x + obj.size/2;
        const minY = obj.y - obj.size/2;
        const maxY = obj.y + obj.size/2;
        if (
          x >= minX && x <= maxX &&
          y >= minY && y <= maxY
        ) {
          // Проверка на столкновение с препятствием
          if (checkCollision(x, y)) {
            alert('Столкновение с препятствием!');
            return;
          }
          if (obj.color === level.targetColor) {
            obj.clicked = true;
            updateProgress();
            if (currentLevel.objects.filter(o => o.clicked).length >= currentLevel.goal) {
              alert('Вы прошли уровень!');
              levelComplete = true;
            }
            break;
          } else {
            alert('Неверный объект!');
            return;
          }
        }
      }
    }
  }

  if (levelComplete) {
    // Можно автоматически перейти к следующему уровню или ждать кнопку
  }
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  handleClick(x, y);
});

nextButton.onclick = () => {
  if (currentLevelIndex < levels.length - 1) {
    currentLevelIndex++;
    currentLevel = levels[currentLevelIndex];
    levelTitle.innerText = `Уровень ${currentLevelIndex + 1}: ${currentLevel.description}`;
    drawLevel();
  } else {
    alert('Это все уровни!');
  }
};

// Инициализация уровня
function startLevel() {
  currentLevel = levels[currentLevelIndex];
  // Сбросить прогресс
  currentLevel.objects.forEach(o => o.clicked = false);
  drawLevel();
}

startLevel();
</script>

</body>
</html>
