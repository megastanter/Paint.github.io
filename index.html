<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>генератор изображений</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff4e50, #ff6f61);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
    color: #fff;
  }

  h1 {
    font-size: 3em;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    text-align: center;
  }

  #form {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    max-width: 700px;
    background: rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  input[type="text"] {
    padding: 15px;
    font-size: 1.3em;
    border-radius: 12px;
    border: 2px solid #fff;
    outline: none;
    margin-bottom: 20px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  input[type="text"]:focus {
    border-color: #ffd700;
    box-shadow: 0 0 10px #ffd700;
  }

  button {
    padding: 15px;
    font-size: 1.4em;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    transition: background 0.3s, transform 0.2s;
  }

  button:hover {
    background: linear-gradient(135deg, #feb47b, #ff7e5f);
    transform: translateY(-2px);
  }

  #status {
    margin-top: 20px;
    font-size: 1.3em;
    min-height: 1.5em;
    text-align: center;
  }

  #imageContainer {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }

  #generatedImage {
    max-width: 100%;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    display: none;
    transition: transform 0.3s;
  }

  #generatedImage:hover {
    transform: scale(1.02);
  }

  /* Адаптивность */
  @media(max-width: 600px){
    h1 {
      font-size: 2em;
    }
    input[type="text"] {
      font-size: 1em;
    }
    button {
      font-size: 1em;
    }
  }
</style>
</head>
<body>

<h1>Крутой Генератор Изображений</h1>

<div id="form">
  <input type="text" id="promptInput" placeholder="Введите описание картинки..." />
  <button id="generateBtn">Генерировать</button>
</div>

<div id="status"></div>
<div id="imageContainer">
  <img id="generatedImage" src="" alt="Сгенерированное изображение" />
</div>

<script>
  const apiKey = 'YOUR_DEEPAI_API_KEY'; // вставьте свой API ключ сюда

  const generateBtn = document.getElementById('generateBtn');
  const promptInput = document.getElementById('promptInput');
  const statusDiv = document.getElementById('status');
  const imageElem = document.getElementById('generatedImage');

  generateBtn.onclick = () => {
    const prompt = promptInput.value.trim();
    if (!prompt) {
      alert('Пожалуйста, введите описание!');
      return;
    }
    statusDiv.innerText = 'Генерация изображения...';
    imageElem.style.display = 'none';

    fetch('https://api.deepai.org/api/text2img', {
      method: 'POST',
      headers: {
        'Api-Key': apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ text: prompt })
    })
    .then(res => res.json())
    .then(data => {
      if (data.output_url) {
        imageElem.src = data.output_url;
        imageElem.style.display = 'block';
        statusDiv.innerText = 'Генерация завершена!';
      } else {
        statusDiv.innerText = 'Ошибка при генерации изображения.';
      }
    })
    .catch(() => {
      statusDiv.innerText = 'Ошибка сети или API.';
    });
  };
</script>

</body>
</html>
